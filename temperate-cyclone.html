<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온대저기압 형성 과정 - 1단계 (3D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#15213a; --muted:#56637d; --line:#d3dae6;
  --btn:#1b2b4b; --btn-ink:#ffffff; --low:#c8283c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1524; --panel:#e9eef7; --ink:#e7ecf6; --muted:#9aa8c4; --line:#2a3552;
    --btn:#e7ecf6; --btn-ink:#0e1524; --low:#ff6b7d;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1524; --panel:#e9eef7; --ink:#e7ecf6; --muted:#9aa8c4; --line:#2a3552;
  --btn:#e7ecf6; --btn-ink:#0e1524; --low:#ff6b7d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1180px; margin:0 auto; padding:20px 20px 28px;}
.head h1{margin:0; font-size:clamp(22px,3.2vw,32px); font-weight:700; letter-spacing:-0.02em;}
.head .sub{margin:6px 0 0; font-size:clamp(15px,1.8vw,18px); color:var(--muted); font-weight:500;}
.panel{
  margin:16px auto 0; width:min(100%, calc(64vh * 1.6)); min-width:min(100%,320px);
  background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden;
}
.panel figcaption{padding:10px 14px; font-size:14px; font-weight:600; color:#56637d; border-bottom:1px solid #d3dae6; background:#fff;}
.panel canvas{display:block; width:100%; height:auto; aspect-ratio:960/600; touch-action:none; cursor:grab; background:#f4f7fb;}
.panel canvas:active{cursor:grabbing;}
.dock{display:grid; grid-template-columns:220px 1fr; gap:22px; align-items:start; margin-top:16px;}
#go{
  min-height:60px; width:100%; padding:0 24px; border:0; border-radius:10px;
  background:var(--btn); color:var(--btn-ink);
  font:700 20px/1 "IBM Plex Sans KR",system-ui,sans-serif; cursor:pointer;
  transition:transform .15s ease, opacity .15s ease;
}
#go:hover:not(:disabled){transform:translateY(-1px);}
#go:active:not(:disabled){transform:translateY(1px);}
#go:focus-visible{outline:3px solid var(--low); outline-offset:3px;}
#go:disabled{opacity:.5; cursor:default;}
.btns{display:flex; flex-direction:column; gap:10px;}
#cloudBtn,#wxCloudBtn{
  min-height:48px; width:100%; padding:0 20px; border-radius:10px;
  background:transparent; color:var(--ink); border:2px solid var(--ink);
  font:600 16px/1 "IBM Plex Sans KR",system-ui,sans-serif; cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
#cloudBtn:hover,#wxCloudBtn:hover{background:var(--ink); color:var(--bg);}
#cloudBtn:focus-visible,#wxCloudBtn:focus-visible{outline:3px solid var(--low); outline-offset:3px;}
#cloudBtn[aria-pressed="false"],#wxCloudBtn[aria-pressed="false"]{background:var(--ink); color:var(--bg);}
.advance{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; animation:swap .45s ease;}
.advance[hidden]{display:none;}
.advance button{
  flex:1 1 150px; min-height:48px; padding:0 16px; border-radius:10px;
  background:var(--btn); color:var(--btn-ink); border:0;
  font:700 16px/1 "IBM Plex Sans KR",system-ui,sans-serif; cursor:pointer;
  transition:transform .15s ease, opacity .15s ease;
}
.advance button:hover:not(:disabled){transform:translateY(-1px);}
.advance button:focus-visible{outline:3px solid var(--low); outline-offset:3px;}
.advance button:disabled{opacity:.4; cursor:default;}
.advance button.on{box-shadow:0 0 0 3px var(--panel), 0 0 0 6px var(--low);}
.tabs{display:flex; gap:6px; margin-top:14px; border-bottom:2px solid var(--line); flex-wrap:wrap;}
.tabs button{
  font:700 clamp(15px,1.9vw,18px)/1.2 "IBM Plex Sans KR",system-ui,sans-serif;
  padding:12px 18px; background:none; border:0; border-bottom:4px solid transparent; margin-bottom:-2px;
  color:var(--muted); cursor:pointer; transition:color .15s ease, border-color .15s ease;
}
.tabs button:hover{color:var(--ink);}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--low);}
.tabs button:focus-visible{outline:3px solid var(--low); outline-offset:-3px; border-radius:6px;}
.panelWx{width:min(100%, calc(74vh * 1.297));}
.panelWx canvas{aspect-ratio:960/740; cursor:default; touch-action:auto;}
.wxdock{display:grid; grid-template-columns:220px 1fr; gap:22px; align-items:center; margin-top:14px;}
#wxMove{
  min-height:60px; width:100%; padding:0 24px; border:0; border-radius:10px;
  background:var(--btn); color:var(--btn-ink);
  font:700 20px/1 "IBM Plex Sans KR",system-ui,sans-serif; cursor:pointer; transition:transform .15s ease, opacity .15s ease;
}
#wxMove:hover:not(:disabled){transform:translateY(-1px);}
#wxMove:focus-visible{outline:3px solid var(--low); outline-offset:3px;}
#wxMove:disabled{opacity:.5; cursor:default;}
#wxCap{margin:0; font-size:clamp(15px,1.8vw,17px); line-height:1.65; min-height:56px;}
.wxcards{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px;}
.wxcard{
  text-align:left; display:flex; flex-direction:column; gap:6px; padding:14px 16px;
  background:var(--panel); color:#15213a; border:2px solid var(--line); border-radius:12px; cursor:pointer;
  font:500 15px/1.6 "IBM Plex Sans KR",system-ui,sans-serif; transition:border-color .15s ease, transform .15s ease;
}
.wxcard:hover{transform:translateY(-1px);}
.wxcard[aria-pressed="true"]{border-color:var(--low); box-shadow:0 0 0 2px var(--low) inset;}
.wxcard:focus-visible{outline:3px solid var(--low); outline-offset:3px;}
.wxcard b{font-size:16px; font-weight:700;}
.wxcard .badge{
  align-self:flex-start; min-width:30px; height:30px; padding:0 8px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:999px; background:#15213a; color:#fff; font-weight:700; font-size:15px;
}
.wxnote{margin:12px 2px 0; font-size:15px; color:var(--muted); line-height:1.6;}
.phases{list-style:none; margin:0 0 12px; padding:0; display:flex; gap:6px;}
.phases li{flex:1; min-width:0; overflow-wrap:anywhere; padding-top:8px; border-top:5px solid var(--line); font-size:12.5px; font-weight:600; color:var(--muted); transition:border-color .3s, color .3s;}
.phases li.done{border-top-color:var(--ink); color:var(--ink);}
.phases li.now{border-top-color:var(--low); color:var(--ink);}
.caption{min-height:112px;}
.caption h2{margin:0 0 6px; font-size:clamp(18px,2.2vw,22px); font-weight:700; letter-spacing:-0.01em;}
.caption p{margin:0; font-size:clamp(15px,1.8vw,17px); line-height:1.65; max-width:70ch;}
.caption.swap{animation:swap .45s ease;}
@keyframes swap{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
@media (max-width:820px){
  .dock{grid-template-columns:1fr; gap:14px;}
  .wxcards{grid-template-columns:1fr;}
  .wxdock{grid-template-columns:1fr; gap:12px;}
  .panelWx{width:100%;}
  .wrap{padding:16px 14px 24px;}
  .panel{width:100%;}
}
@media (prefers-reduced-motion: reduce){
  .caption.swap{animation:none;}
  #go{transition:none;}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1 id="pageTitle">온대저기압은 어떻게 만들어질까?</h1>
    <p class="sub" id="pageSub">1단계. 팽팽하던 두 기단의 균형이 깨지면 저기압이 생긴다</p>
  </header>

  <div class="tabs" role="tablist" aria-label="온대저기압 학습 내용">
    <button type="button" role="tab" id="tabForm" aria-selected="true" aria-controls="viewForm">온대저기압의 형성</button>
    <button type="button" role="tab" id="tabWx" aria-selected="false" aria-controls="viewWx" tabindex="-1">온대저기압의 날씨</button>
  </div>

  <div id="viewForm" role="tabpanel" aria-labelledby="tabForm">
  <figure class="panel">
    <figcaption>입체로 본 온대저기압 (끌면 회전, 마우스 휠이나 두 손가락 벌리기로 확대/축소, 더블클릭하면 원래대로)</figcaption>
    <canvas id="cv" role="img" aria-label="찬 공기와 따뜻한 공기가 만나는 전선이 물결 모양으로 휘어지고, 따뜻한 공기가 찬 공기를 타고 올라가며 저기압이 생기고 바람이 반시계 방향으로 부는 입체 그림"></canvas>
  </figure>

  <section class="dock">
    <div class="btns">
      <button id="go" type="button">균형 깨뜨리기</button>
      <button id="cloudBtn" type="button" aria-pressed="true">구름 숨기기</button>
    </div>
    <div class="info">
      <ol class="phases" id="phases"></ol>
      <div class="caption" id="cap" aria-live="polite">
        <h2 id="capT"></h2>
        <p id="capP"></p>
      </div>
      <div class="advance" id="advRow" hidden>
        <button id="advCold" type="button">한랭전선의 전진</button>
        <button id="advWarm" type="button">온난전선의 전진</button>
        <button id="advBoth" type="button">두 전선의 전진</button>
      </div>
    </div>
  </section>
  </div>

  <div id="viewWx" role="tabpanel" aria-labelledby="tabWx" hidden>
    <figure class="panel panelWx">
      <figcaption>온대저기압의 이동과 주변의 날씨 (전선면의 기울기는 과장하여 표현하였다.)</figcaption>
      <canvas id="cvWx" role="img" aria-label="온대저기압을 입체로 나타낸 그림과 A에서 C까지 자른 단면도. 한랭 전선 쪽에는 적운형 구름과 소나기, 온난 전선 앞쪽에는 층운형 구름과 넓은 지역의 장시간 비가 나타난다."></canvas>
    </figure>
    <div class="wxdock">
      <div class="btns">
        <button id="wxMove" type="button">전선의 이동</button>
        <button id="wxCloudBtn" type="button" aria-pressed="true">구름 숨기기</button>
      </div>
      <p id="wxCap" aria-live="polite"></p>
    </div>
    <section class="wxcards" aria-label="지역별 날씨">
      <button type="button" class="wxcard" data-k="A" aria-pressed="false">
        <span class="badge">A 지역</span><b>한랭 전선이 통과할 때</b>
        <span>적운형 구름이 생기면서 짧은 시간 동안 강한 비가 내려요. 통과한 뒤에는 찬 공기가 들어와 기온이 떨어져요.</span>
      </button>
      <button type="button" class="wxcard" data-k="B" aria-pressed="false">
        <span class="badge">B 지역</span><b>온난 전선이 지나간 뒤</b>
        <span>남쪽의 따뜻한 공기가 들어와 따뜻하고 맑은 날씨가 나타나요.</span>
      </button>
      <button type="button" class="wxcard" data-k="C" aria-pressed="false">
        <span class="badge">C 지역</span><b>온난 전선의 앞쪽</b>
        <span>층운형 구름이 넓게 발달해서, 전선이 통과하기 한참 전부터 흐리고 오랫동안 비가 내려요.</span>
      </button>
    </section>
    <p class="wxnote">온대 저기압은 서쪽에서 동쪽으로 이동하고, 두 전선도 함께 이동해요. 전선이 영향을 미치는 시간은 온난 전선은 약 10시간 정도이고, 한랭 전선은 수 시간 이내로 짧아요. (카드를 누르면 단면도에서 그 지역이 표시돼요.)</p>
  </div>
</main>

<script>
(function(){
'use strict';

var W=960, H=600;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var FONT='"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';

function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function smooth(a,b,x){var k=clamp((x-a)/(b-a),0,1);return k*k*(3-2*k);}
function lerp(a,b,k){return a+(b-a)*k;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R=rng(23);

var TK=1;
function fit(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=cv.clientWidth||900;
  cv.width=Math.round(w*dpr);
  cv.height=Math.round(w*dpr*H/W);
  TK=clamp(700/w,1,2.2);
}
window.addEventListener('resize',fit);

/* ---------- 진행 상태 ---------- */
var DUR=17, mode='idle', t=0, clock=0;
var advT=0, ADV=0, ADVDUR=9, TH0=5.25, DEL=1.70, LBASE=66;   /* 한랭 전선 전진 (빠름: 9초) */
var advWt=0, ADVW=0, ADVWDUR=18, ROTW=0.34, LBASEW=52; /* 온난 전선 전진 (느림: 18초) */
var advKind='cold', pendingKind='cold';
var advB=0, ADVBDUR=27, occT=0, OCC=0, RT=24;   /* 두 전선 전진 + 폐색 */
var P={a:0,rise:0,p:1012,s:0,cl:0,rain:0};
function params(){
  P.a   =smooth(0.04,0.72,t);
  P.rise=smooth(0.03,0.30,t);
  P.p   =1012-22*smooth(0.10,0.82,t);
  P.s   =smooth(0.35,0.85,t);
  P.cl  =smooth(0.18,0.65,t);
  P.rain=smooth(0.45,0.88,t);
  ADV=smooth(0,1,advT);
  ADVW=smooth(0,1,advWt);
  OCC=smooth(0,1,occT);
}

/* =====================================================
   3차원 세계 좌표
   x: 동쪽(+)  y: 북쪽(+)  z: 위쪽(+)
   블록 크기 X x Y x Z, 지면은 z=0, 흙 두께 SD
   ===================================================== */
var X=100, Y=70, Z=26, SD=5;
var Y0=32, AMP=24, CXw=50, SLw=9, SRw=19;

/* 최종 모양: 저기압 중심에서 한랭 전선은 남서쪽으로, 온난 전선은 동쪽으로 길게 뻗음 */
function frontShape(x){
  var dx=Math.abs(x-CXw), m=(x<CXw)?0.95:0.5, r=(x<CXw)?7:14;
  return AMP-m*(Math.sqrt(dx*dx+r*r)-r);
}
function yfS(x){
  return Y0+P.a*frontShape(x);
}
function yfT(x){
  var y=yfS(x);
  if(!reduce)y+=(1-smooth(0,0.08,t))*0.22*Math.sin(clock*24+x*0.5);
  return y;
}
function yfp(x){return (yfS(x+0.4)-yfS(x-0.4))/0.8;}
function lowY(){return Y0+P.a*AMP;}

/* =====================================================
   전선을 하나의 곡선(폴리라인)으로 다룬다.
   한랭 전선 꼬리(남서쪽) -> 저기압 중심 -> 온난 전선 꼬리(동쪽)
   찬 공기는 곡선의 왼쪽에 있다.
   ===================================================== */
var FR={pts:[[0,Y0],[X,Y0]],ds:X,total:X,uA:X/2};
function inBlock(q){return q[0]>0.05&&q[0]<X-0.05&&q[1]>0.05&&q[1]<Y-0.05;}
function clipPts(p){
  for(var k=1;k<p.length;k++){
    var q=p[k];
    if(q[0]<0||q[0]>X||q[1]<0||q[1]>Y){
      var a=p[k-1],lo=0,hi=1,m;
      for(var it=0;it<24;it++){
        m=(lo+hi)/2;
        var mx=a[0]+(q[0]-a[0])*m,my=a[1]+(q[1]-a[1])*m;
        if(mx<0||mx>X||my<0||my>Y)hi=m;else lo=m;
      }
      var out=p.slice(0,k);
      out.push([clamp(a[0]+(q[0]-a[0])*lo,0,X),clamp(a[1]+(q[1]-a[1])*lo,0,Y)]);
      return out;
    }
  }
  return p;
}
function resample(raw){
  var cum=[0],i;
  for(i=1;i<raw.length;i++)cum[i]=cum[i-1]+Math.hypot(raw[i][0]-raw[i-1][0],raw[i][1]-raw[i-1][1]);
  var total=cum[cum.length-1], n=Math.max(4,Math.round(total/1.2)), ds=total/n, out=[], j=0;
  for(i=0;i<=n;i++){
    var u=i*ds;
    while(j<raw.length-2&&cum[j+1]<u)j++;
    var seg=(cum[j+1]-cum[j])||1, tt=clamp((u-cum[j])/seg,0,1);
    out.push([raw[j][0]+(raw[j+1][0]-raw[j][0])*tt,raw[j][1]+(raw[j+1][1]-raw[j][1])*tt]);
  }
  return {pts:out,ds:ds,total:total,cum:cum};
}
function buildFront(){
  var ly=lowY(), x, i, k;
  /* ----- 온난 전선: 저기압 중심에서 동쪽으로 ----- */
  var Wr=[[CXw,ly]], wprev=[CXw,ly], wx=CXw, wy=ly, wsacc=0;
  for(x=CXw+0.5;x<=X+1e-6;x+=0.5){
    var bx2=x, by2=Y0+P.a*frontShape(x);
    var jx=bx2-wprev[0], jy=by2-wprev[1], wl=Math.hypot(jx,jy);
    var thb2=Math.atan2(jy,jx);
    /* 저기압 중심에 가까운 부분일수록 더 많이 돌아서(반시계) 북쪽으로 볼록해진다 */
    var th2=thb2+ADVW*ROTW*(1-0.6*clamp(wsacc/LBASEW,0,1));
    wx+=wl*Math.cos(th2); wy+=wl*Math.sin(th2);
    Wr.push([wx,wy]);
    wsacc+=wl; wprev=[bx2,by2];
  }
  var wlast=Wr[Wr.length-1];
  if(inBlock(wlast)){
    var wdx=wlast[0]-Wr[Wr.length-2][0], wdy=wlast[1]-Wr[Wr.length-2][1], wdl=Math.hypot(wdx,wdy)||1;
    wdx/=wdl; wdy/=wdl;
    for(var kw=0;kw<500;kw++){
      wlast=[wlast[0]+wdx*0.5,wlast[1]+wdy*0.5];
      Wr.push(wlast);
      if(!inBlock(wlast))break;
    }
  }
  Wr=clipPts(Wr);

  /* ----- 한랭 전선: 저기압 중심에서 남쪽으로. 전진할수록 반시계 방향으로 돌며 동쪽으로 볼록해진다 ----- */
  var Cr=[[CXw,ly]], prev=[CXw,ly], px=CXw, py=ly, sacc=0;
  for(x=CXw-0.5;x>=-1e-6;x-=0.5){
    var bx=x, by=Y0+P.a*frontShape(x);
    var ix=bx-prev[0], iy=by-prev[1], len=Math.hypot(ix,iy);
    var thb=Math.atan2(iy,ix); if(thb<0)thb+=2*Math.PI;
    var tha=TH0-DEL*Math.pow(clamp(sacc/LBASE,0,1),0.9);
    var th=lerp(thb,tha,ADV);
    px+=len*Math.cos(th); py+=len*Math.sin(th);
    Cr.push([px,py]);
    sacc+=len; prev=[bx,by];
  }

  /* ----- 폐색: 지퍼가 잠기듯 ----- */
  if(OCC>0.001){
    /* 온난 전선을 저기압 중심 기준 극좌표(거리, 각도)로 */
    var wr=[], wa=[];
    for(k=1;k<Wr.length;k++){
      var wdx2=Wr[k][0]-CXw, wdy2=Wr[k][1]-ly;
      wr.push(Math.hypot(wdx2,wdy2)); wa.push(Math.atan2(wdy2,wdx2));
    }
    var alphaW=function(r){
      var n=wr.length;
      if(r<=wr[0])return wa[0];
      if(r>=wr[n-1])return wa[n-1];
      var lo=0,hi=n-1;
      while(hi-lo>1){var m=(lo+hi)>>1;if(wr[m]<=r)lo=m;else hi=m;}
      return wa[lo]+(wa[hi]-wa[lo])*((r-wr[lo])/((wr[hi]-wr[lo])||1));
    };
    var nc=[Cr[0]];
    for(k=1;k<Cr.length;k++){
      var cdx=Cr[k][0]-CXw, cdy=Cr[k][1]-ly, rr=Math.hypot(cdx,cdy), al=Math.atan2(cdy,cdx);
      var aw=alphaW(rr), del=aw-al;
      while(del>Math.PI)del-=2*Math.PI;
      while(del<-Math.PI)del+=2*Math.PI;
      /* 저기압에 가까운 곳부터 차례로 온난 전선에 붙는다(지퍼). 붙는 데 걸리는 시간은 같지만
         멀리 있는 곳일수록 돌아야 할 각도와 거리가 커서 더 빠르게 추격하는 셈이다 */
      var cc=smooth(0,1,(OCC-0.6*rr/RT)/0.4);
      /* 아주 먼 부분도 조금씩 따라붙는다 */
      var farK=1-0.35*OCC*smooth(RT,2*RT,rr);
      var na=aw-del*(1-cc)*farK;
      nc.push([CXw+rr*Math.cos(na),ly+rr*Math.sin(na)]);
    }
    Cr=nc;
  }

  var last=Cr[Cr.length-1];
  if(inBlock(last)){
    var ddx=last[0]-Cr[Cr.length-2][0], ddy=last[1]-Cr[Cr.length-2][1], dl2=Math.hypot(ddx,ddy)||1;
    ddx/=dl2; ddy/=dl2;
    for(var kc=0;kc<500;kc++){
      last=[last[0]+ddx*0.5,last[1]+ddy*0.5];
      Cr.push(last);
      if(!inBlock(last))break;
    }
  }
  Cr=clipPts(Cr);

  /* 이미 붙은 구간(저기압 중심 ~ 접점 J)이 폐색 전선 */
  var occ=[[CXw,ly]], J=[CXw,ly];
  var rz=RT*Math.max(0,(OCC-0.39)/0.6);
  if(rz>0.6){
    var jw=-1;
    for(k=1;k<Wr.length;k++){if(Math.hypot(Wr[k][0]-CXw,Wr[k][1]-ly)>=rz){jw=k;break;}}
    if(jw>0){
      var pa=Wr[jw-1], pb=Wr[jw];
      var ra=Math.hypot(pa[0]-CXw,pa[1]-ly), rb=Math.hypot(pb[0]-CXw,pb[1]-ly), tq=(rz-ra)/((rb-ra)||1);
      J=[pa[0]+(pb[0]-pa[0])*tq,pa[1]+(pb[1]-pa[1])*tq];
      occ=Wr.slice(0,jw);occ.push(J);
      Wr=[J].concat(Wr.slice(jw));
      var nc2=[J];
      for(k=1;k<Cr.length;k++){if(Math.hypot(Cr[k][0]-CXw,Cr[k][1]-ly)>rz)nc2.push(Cr[k]);}
      Cr=nc2;
    }
  }
  var occCum=[0];
  for(i=1;i<occ.length;i++)occCum[i]=occCum[i-1]+Math.hypot(occ[i][0]-occ[i-1][0],occ[i][1]-occ[i-1][1]);
  FR.occ=occ;FR.occCum=occCum;FR.T=J;

  var raw=[];
  for(i=Cr.length-1;i>=0;i--)raw.push(Cr[i]);
  for(i=1;i<Wr.length;i++)raw.push(Wr[i]);
  var rs=resample(raw);
  FR.pts=rs.pts;FR.ds=rs.ds;FR.total=rs.total;FR.uA=rs.cum[Cr.length-1];
}
/* 점 (x,y)에서 전선까지의 부호 있는 거리(찬 공기 쪽이 +)와 가장 가까운 지점의 호 길이 */
var FDd=0, FDu=0;
function frontInfo(x,y){
  var pts=FR.pts, n=pts.length, best=1e9, bu=0, sg=1;
  for(var i=0;i<n-1;i++){
    var ax=pts[i][0], ay=pts[i][1], dx=pts[i+1][0]-ax, dy=pts[i+1][1]-ay, l2=dx*dx+dy*dy||1e-9;
    var tt=((x-ax)*dx+(y-ay)*dy)/l2;
    tt=tt<0?0:(tt>1?1:tt);
    var qx=ax+tt*dx-x, qy=ay+tt*dy-y, d2=qx*qx+qy*qy;
    if(d2<best){best=d2;bu=i*FR.ds+tt*Math.sqrt(l2);sg=(dx*(y-ay)-dy*(x-ax))>=0?1:-1;}
  }
  FDd=sg*Math.sqrt(best);FDu=bu;
}
function pointAt(u){
  var pts=FR.pts, n=pts.length-1, f=clamp(u/FR.ds,0,n-1e-6), i=Math.floor(f), tt=f-i;
  var a=pts[i], b=pts[i+1], dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1;
  return [a[0]+dx*tt,a[1]+dy*tt,dx/l,dy/l];
}
/* 전선면: 찬 공기 쐐기의 윗면 높이 (한랭 전선 쪽이 더 가파름) */
function slopeAt(u){
  var cb=smooth(FR.uA+4,FR.uA-4,u);
  return 0.55+0.55*cb*smooth(0.1,0.6,P.a);
}
function hAt(x,y){
  frontInfo(x,y);
  if(FDd<=0)return 0;
  return Math.min(Z,slopeAt(FDu)*FDd);
}
/* 지면을 찬 공기/따뜻한 공기 영역으로 나누기 위한 블록 둘레 계산 */
var PT=2*(X+Y), CORN=[[X,Y,Y],[0,Y,Y+X],[0,0,2*Y+X],[X,0,PT]];
function perim(x,y){
  var e=0.05;
  if(x>=X-e)return y;
  if(y>=Y-e)return Y+(X-x);
  if(x<=e)return Y+X+(Y-y);
  return 2*Y+X+x;
}
function walk(u1,u2){
  if(u2<u1)u2+=PT;
  var out=[];
  for(var k=0;k<2;k++)for(var j=0;j<CORN.length;j++){
    var uc=CORN[j][2]+k*PT;
    if(uc>u1+1e-6&&uc<u2-1e-6)out.push([CORN[j][0],CORN[j][1]]);
  }
  return out;
}
function groundPolys(){
  var pts=FR.pts, C=pts[0], Wt=pts[pts.length-1], i;
  var uC=perim(C[0],C[1]), uW=perim(Wt[0],Wt[1]);
  var cold=[], warm=[];
  for(i=0;i<pts.length;i++){cold.push([pts[i][0],pts[i][1],0.02]);warm.push([pts[i][0],pts[i][1],0.02]);}
  var w1=walk(uW,uC), w2=walk(uC,uW);
  for(i=0;i<w1.length;i++)cold.push([w1[i][0],w1[i][1],0.02]);
  for(i=w2.length-1;i>=0;i--)warm.push([w2[i][0],w2[i][1],0.02]);
  return {cold:cold,warm:warm};
}

/* ---------- 카메라 (정투영 + 약한 원근) ---------- */
var CAM={a:0.62,p:0.5,ca:1,sa:0,cp:1,sp:0};
var SC=5.8, DIST=420, ZC=9, ZOOM=1, cloudsOn=true, cloudA=1;
function updCam(){
  CAM.ca=Math.cos(CAM.a);CAM.sa=Math.sin(CAM.a);CAM.cp=Math.cos(CAM.p);CAM.sp=Math.sin(CAM.p);
  SC=(5.8-1.3*smooth(0.5,1.4,CAM.p))*ZOOM;
}
function pr(x,y,z){
  var xx=x-X/2, yy=y-Y/2, zz=z-ZC;
  var x1=xx*CAM.ca+yy*CAM.sa, y1=-xx*CAM.sa+yy*CAM.ca;
  var up=zz*CAM.cp+y1*CAM.sp, dep=y1*CAM.cp-zz*CAM.sp;
  var f=DIST/(DIST+dep);
  return {x:W/2+x1*SC*f, y:H/2+8-up*SC*f, d:dep, f:f};
}

/* ---------- 그리기 도구 ---------- */
function poly(c,pts,fill,stroke){
  c.beginPath();
  for(var i=0;i<pts.length;i++){var q=pr(pts[i][0],pts[i][1],pts[i][2]);if(i)c.lineTo(q.x,q.y);else c.moveTo(q.x,q.y);}
  c.closePath();
  if(fill){c.fillStyle=fill;c.fill();}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=1.3;c.stroke();}
}
function line3(c,a,b){
  var p=pr(a[0],a[1],a[2]),q=pr(b[0],b[1],b[2]);
  c.beginPath();c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.stroke();
}
function arrow2(c,x1,y1,x2,y2,col,w,hs){
  var ang=Math.atan2(y2-y1,x2-x1);
  function path(){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-Math.cos(ang)*hs*0.6,y2-Math.sin(ang)*hs*0.6);}
  function head(){c.beginPath();c.moveTo(x2,y2);
    c.lineTo(x2-Math.cos(ang-0.45)*hs,y2-Math.sin(ang-0.45)*hs);
    c.lineTo(x2-Math.cos(ang+0.45)*hs,y2-Math.sin(ang+0.45)*hs);c.closePath();}
  c.lineCap='round';c.lineJoin='round';
  c.strokeStyle='rgba(255,255,255,.92)';c.lineWidth=w+3.5;path();c.stroke();head();c.stroke();
  c.strokeStyle=col;c.fillStyle=col;c.lineWidth=w;path();c.stroke();head();c.fill();
}
function arrow3(c,a,b,col,w,hs){
  var p=pr(a[0],a[1],a[2]),q=pr(b[0],b[1],b[2]);
  arrow2(c,p.x,p.y,q.x,q.y,col,w*p.f,hs*p.f);
}
function label(c,txt,x,y,o){
  o=o||{};
  var size=(o.size||14)*TK;
  c.font=(o.weight||600)+' '+size+'px '+FONT;
  c.textAlign=o.align||'left';c.textBaseline='middle';
  c.lineJoin='round';c.lineWidth=4;
  c.strokeStyle=o.stroke||'rgba(15,25,50,.62)';c.strokeText(txt,x,y);
  c.fillStyle=o.fill||'#fff';c.fillText(txt,x,y);
}
function rr(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}
function mix(c1,c2,k){
  var a=[parseInt(c1.slice(1,3),16),parseInt(c1.slice(3,5),16),parseInt(c1.slice(5,7),16)];
  var b=[parseInt(c2.slice(1,3),16),parseInt(c2.slice(3,5),16),parseInt(c2.slice(5,7),16)];
  return 'rgb('+Math.round(lerp(a[0],b[0],k))+','+Math.round(lerp(a[1],b[1],k))+','+Math.round(lerp(a[2],b[2],k))+')';
}
function puff(c,x,y,r){
  c.beginPath();
  c.arc(x,y,r,0,7);
  c.moveTo(x-r*0.85+r*0.75,y+r*0.25);c.arc(x-r*0.85,y+r*0.25,r*0.75,0,7);
  c.moveTo(x+r*0.85+r*0.8,y+r*0.2);c.arc(x+r*0.85,y+r*0.2,r*0.8,0,7);
  c.fill();
}

/* =====================================================
   지표면 바람 (반시계 회전 포함)
   ===================================================== */
var U0=7;
var gp=[];
for(var i0=0;i0<120;i0++)gp.push({x:R()*X,y:R()*Y,tr:[]});
var gv=[0,0];
function groundVel(x,y){
  frontInfo(x,y);
  var vx=(FDd>0?-1:1)*U0, vy=0;
  if(P.s>0.001){
    var dx=x-CXw, dy=y-lowY(), r=Math.hypot(dx,dy)+0.001;
    var w=P.s*Math.exp(-Math.pow(r/36,2));
    var q=r/8.6, vt=19*q/(1+q*q);
    var tx=-dy/r, ty=dx/r;      // 반시계 방향 (위에서 볼 때)
    var ix=-dx/r, iy=-dy/r;     // 중심으로 수렴
    var sx=vt*tx+0.35*vt*ix, sy=vt*ty+0.35*vt*iy;
    vx=(1-w)*vx+w*sx; vy=(1-w)*vy+w*sy;
  }
  gv[0]=vx;gv[1]=vy;
}
function stepGround(dt){
  var ly=lowY();
  for(var i=0;i<gp.length;i++){
    var p=gp[i];
    groundVel(p.x,p.y);
    p.x+=gv[0]*dt;p.y+=gv[1]*dt;
    var rs=false;
    if(p.x>X){p.x=0;p.tr.length=0;}
    else if(p.x<0){p.x=X;p.tr.length=0;}
    if(p.y<0||p.y>Y)rs=true;
    if(P.s>0.3&&Math.hypot(p.x-CXw,p.y-ly)<2.2)rs=true;
    if(rs){p.x=Math.random()*X;p.y=Math.random()*Y;p.tr.length=0;}
    p.tr.push([p.x,p.y]);
    if(p.tr.length>12)p.tr.shift();
  }
}

/* 구름 (전선면 위쪽 = 상승한 따뜻한 공기가 식어 생김) */
var wC=[],cC=[],i2;
for(i2=0;i2<64;i2++){
  var ff=R();
  wC.push({f:ff,dd:2+R()*26,zr:R()*2.5,r:2.2+R()*1.8,dl:ff*0.5+R()*0.15,ph:R()});
}
for(i2=0;i2<40;i2++){
  cC.push({f:R(),dd:R()*5,z:1.5+R()*11,r:2+R()*1.6,dl:0.08+R()*0.3,ph:R()});
}

var oC=[];
for(var io=0;io<34;io++){oC.push({f:R(),side:R()<0.5?-1:1,dd:R()*5,z:2+R()*10,r:2.2+R()*1.8,dl:R()*0.35,ph:R()});}
function occAt(f){
  var pts=FR.occ, cum=FR.occCum, n=pts.length;
  if(n<2)return null;
  var u=clamp(f,0,1)*cum[n-1], j=1;
  while(j<n-1&&cum[j]<u)j++;
  var a=pts[j-1], b=pts[j], dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1;
  var tt=clamp((u-cum[j-1])/((cum[j]-cum[j-1])||1),0,1);
  return [a[0]+dx*tt,a[1]+dy*tt,dx/l,dy/l];
}
function typeAt(u){
  if(P.a<0.03)return 0;
  var sd=Math.abs(u-FR.uA);
  if(sd<8+P.a*72)return u<FR.uA?1:2;
  return 0;
}

/* =====================================================
   장면 그리기
   ===================================================== */
var WALLS=[
  {n:[0,1],  a:function(u){return [u*X,Y];}, col:'#7a5d40'},   /* 북 */
  {n:[0,-1], a:function(u){return [u*X,0];}, col:'#8b6b4a'},   /* 남 */
  {n:[1,0],  a:function(u){return [X,u*Y];}, col:'#6d533a'},   /* 동 */
  {n:[-1,0], a:function(u){return [0,u*Y];}, col:'#7a5d40'}    /* 서 */
];
/* 카메라 쪽을 향한 벽인지 */
function isFront(w){return w.n[0]*CAM.sa-w.n[1]*CAM.ca>0.001;}
function wallDraw(c,w,warmFill,coldFill,solid){
  var N=40,i,q,pts=[];
  var m=w.a(0.5),pt=pr(m[0],m[1],Z),pb=pr(m[0],m[1],0);
  var fill=warmFill;
  if(solid){var g=c.createLinearGradient(0,pt.y,0,pb.y);g.addColorStop(0,'#fde6c4');g.addColorStop(1,'#f6bd7c');fill=g;}
  var a0=w.a(0),a1=w.a(1);
  poly(c,[[a0[0],a0[1],0],[a1[0],a1[1],0],[a1[0],a1[1],Z],[a0[0],a0[1],Z]],fill);
  for(i=0;i<=N;i++){q=w.a(i/N);pts.push([q[0],q[1],0]);}
  for(i=N;i>=0;i--){q=w.a(i/N);pts.push([q[0],q[1],hAt(q[0],q[1])]);}
  poly(c,pts,coldFill);
}

function drawScene(c,sc,opts){
  var i,j,x,y;
  opts=opts||{};
  c.setTransform(sc,0,0,sc,0,0);c.globalAlpha=1;c.clearRect(0,0,W,H);
  updCam();
  var ly=lowY();

  /* ----- 1. 카메라 반대쪽(뒤쪽) 벽 ----- */
  WALLS.forEach(function(w){w.fr=isFront(w);});
  WALLS.forEach(function(w){if(!w.fr)wallDraw(c,w,null,'rgba(86,128,208,.86)',true);});

  /* ----- 2. 흙 단면과 지면 ----- */
  WALLS.forEach(function(w){
    if(!w.fr)return;
    var b0=w.a(0),b1=w.a(1);
    poly(c,[[b0[0],b0[1],0],[b1[0],b1[1],0],[b1[0],b1[1],-SD],[b0[0],b0[1],-SD]],w.col);
  });
  var gpoly=groundPolys();
  poly(c,gpoly.warm,'#f3b26a');
  poly(c,gpoly.cold,'#a9cbef');
  /* 격자 */
  c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=1;c.beginPath();
  for(x=10;x<X;x+=10){var a1=pr(x,0,0.03),a2=pr(x,Y,0.03);c.moveTo(a1.x,a1.y);c.lineTo(a2.x,a2.y);}
  for(y=10;y<Y;y+=10){var b1=pr(0,y,0.03),b2=pr(X,y,0.03);c.moveTo(b1.x,b1.y);c.lineTo(b2.x,b2.y);}
  c.stroke();

  /* ----- 3. 등압선 ----- */
  var vals=[1008,1004,1000,996,992], rad=[16,13,9.4,6.3,3.4];
  for(i=0;i<vals.length;i++){
    var f=clamp((vals[i]-P.p)/3,0,1);
    if(f<=0)continue;
    var r0=rad[i]*(0.55+0.45*f);
    c.strokeStyle='rgba(255,255,255,'+(0.95*f)+')';c.lineWidth=1.8;c.beginPath();
    for(j=0;j<=48;j++){
      var th=j/48*Math.PI*2, q=pr(CXw+r0*Math.cos(th),ly+r0*Math.sin(th),0.1);
      if(j)c.lineTo(q.x,q.y);else c.moveTo(q.x,q.y);
    }
    c.stroke();
  }

  /* ----- 4. 전선(지면 위 선)과 전선 기호 ----- */
  var pts=FR.pts;
  c.lineJoin='round';c.lineCap='round';
  c.beginPath();
  for(i=0;i<pts.length;i++){var q0=pr(pts[i][0],pts[i][1],0.06);if(i)c.lineTo(q0.x,q0.y);else c.moveTo(q0.x,q0.y);}
  c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=6;c.stroke();
  c.strokeStyle='#1a2547';c.lineWidth=2.6;c.stroke();

  var kk=0;
  for(var s=2.2;s<FR.total-1.5;s+=4.8,kk++){
    var idx=clamp(Math.round(s/FR.ds),0,pts.length-1);
    var i0=Math.max(0,idx-2),i1=Math.min(pts.length-1,idx+2);
    var tx=pts[i1][0]-pts[i0][0],ty=pts[i1][1]-pts[i0][1],L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
    var px=pts[idx][0],py=pts[idx][1],tp=typeAt(s);
    if(tp===1||(tp===0&&kk%2===0)){
      /* 한랭 전선: 파란 삼각형(이동 방향인 따뜻한 공기 쪽으로) */
      var nsx=ty,nsy=-tx,hw=1.15,hh=1.8;
      poly(c,[[px-tx*hw,py-ty*hw,0.08],[px+tx*hw,py+ty*hw,0.08],[px+nsx*hh,py+nsy*hh,0.08]],'#1f55b8','#fff');
    }else{
      /* 온난 전선: 빨간 반원(이동 방향인 찬 공기 쪽으로) */
      var nnx=-ty,nny=tx,r=1.35,sp=[];
      for(var qn=0;qn<=10;qn++){
        var ph=Math.PI*qn/10;
        sp.push([px-tx*r*Math.cos(ph)+nnx*r*Math.sin(ph),py-ty*r*Math.cos(ph)+nny*r*Math.sin(ph),0.08]);
      }
      poly(c,sp,'#c8283c','#fff');
    }
  }

  /* 폐색 전선: 저기압 중심에서 접점까지. 파란 삼각형과 빨간 반원이 같은 쪽(이동 방향)에 번갈아 */
  if(OCC>0.02&&FR.occ.length>1){
    c.globalAlpha=smooth(0.02,0.18,OCC);
    var op=FR.occ, oc=FR.occCum, olen=oc[oc.length-1];
    c.beginPath();
    for(i=0;i<op.length;i++){var qo=pr(op[i][0],op[i][1],0.07);if(i)c.lineTo(qo.x,qo.y);else c.moveTo(qo.x,qo.y);}
    c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=6.5;c.stroke();
    c.strokeStyle='#7b3fa0';c.lineWidth=3;c.stroke();
    var oj=1,ok=0;
    for(var so=1.6;so<olen-1.0;so+=4.4,ok++){
      while(oj<op.length-1&&oc[oj]<so)oj++;
      var oa=op[oj-1],ob=op[oj],otx=ob[0]-oa[0],oty=ob[1]-oa[1],ol=Math.hypot(otx,oty)||1;
      otx/=ol;oty/=ol;
      var ot=(so-oc[oj-1])/((oc[oj]-oc[oj-1])||1), opx=oa[0]+(ob[0]-oa[0])*ot, opy=oa[1]+(ob[1]-oa[1])*ot;
      var onx=-oty, ony=otx;
      if(ok%2===0){
        poly(c,[[opx-otx*1.15,opy-oty*1.15,0.09],[opx+otx*1.15,opy+oty*1.15,0.09],[opx+onx*1.8,opy+ony*1.8,0.09]],'#1f55b8','#fff');
      }else{
        var osp=[];
        for(var qn2=0;qn2<=10;qn2++){
          var ph2=Math.PI*qn2/10;
          osp.push([opx-otx*1.35*Math.cos(ph2)+onx*1.35*Math.sin(ph2),opy-oty*1.35*Math.cos(ph2)+ony*1.35*Math.sin(ph2),0.09]);
        }
        poly(c,osp,'#c8283c','#fff');
      }
    }
    c.globalAlpha=1;
  }

  /* 균형 상태: 서로 미는 힘 */
  var tension=1-smooth(0.10,0.24,t);
  if(tension>0.01){
    c.globalAlpha=tension;
    var e=smooth(0,0.12,t);
    [32,50,68].forEach(function(ax,jj){
      var fyx=yfT(ax),center=(jj===1);
      var lc=center?8*(1-e):8, lw=center?8+11*e:8;
      if(lc>0.5)arrow3(c,[ax,fyx+1.6+lc,0.5],[ax,fyx+1.6,0.5],'#1b4fa8',5,11);
      arrow3(c,[ax,fyx-1.6-lw,0.5],[ax,fyx-1.6,0.5],'#b5470f',5,11);
    });
    if(t<0.05){
      var q1=pr(CXw,Y0+14,0.5),q2=pr(CXw,Y0-15,0.5);
      label(c,'찬 공기가 미는 힘',q1.x,q1.y,{size:14,align:'center'});
      label(c,'따뜻한 공기가 미는 힘',q2.x,q2.y,{size:14,align:'center',fill:'#4a1f05',stroke:'rgba(255,236,210,.92)'});
    }
    c.globalAlpha=1;
  }
  if(!reduce&&t>0&&t<0.14){
    var u=t/0.14;
    c.strokeStyle='rgba(255,255,255,'+(0.95*(1-u))+')';c.lineWidth=3;
    [2+15*u,1+8*u].forEach(function(rd){
      c.beginPath();
      for(var k=0;k<=40;k++){
        var th=k/40*Math.PI*2,qq=pr(CXw+rd*Math.cos(th),yfT(CXw)+rd*Math.sin(th),0.15);
        if(k)c.lineTo(qq.x,qq.y);else c.moveTo(qq.x,qq.y);
      }
      c.stroke();
    });
  }

  /* ----- 5. 지표면 바람 입자 ----- */
  for(i=0;i<gp.length;i++){
    var p=gp[i],n=p.tr.length;
    if(n<3)continue;
    var sp2=[];
    for(j=0;j<n;j++)sp2.push(pr(p.tr[j][0],p.tr[j][1],1.2));
    c.lineCap='round';c.lineWidth=2;
    for(j=1;j<n;j++){
      c.strokeStyle='rgba(255,255,255,'+(j/n*0.85)+')';
      c.beginPath();c.moveTo(sp2[j-1].x,sp2[j-1].y);c.lineTo(sp2[j].x,sp2[j].y);c.stroke();
    }
    var hx=sp2[n-1].x,hy=sp2[n-1].y,dx=hx-sp2[n-3].x,dy=hy-sp2[n-3].y,dl=Math.hypot(dx,dy);
    if(dl>0.01){
      dx/=dl;dy/=dl;
      c.fillStyle='rgba(255,255,255,.95)';c.beginPath();
      c.moveTo(hx+dx*4.5,hy+dy*4.5);
      c.lineTo(hx-dx*2+dy*3.3,hy-dy*2-dx*3.3);
      c.lineTo(hx-dx*2-dy*3.3,hy-dy*2+dx*3.3);
      c.closePath();c.fill();
    }
  }

  /* ----- 6. 전선면 (찬 공기 쐐기의 윗면, 반투명) ----- */
  var NX=50,NY=35,vx=[],vh=[],vp=[];
  for(j=0;j<=NY;j++){
    for(i=0;i<=NX;i++){
      var wx=i*X/NX, wy=j*Y/NY, hh2=hAt(wx,wy);
      vh.push(hh2);vp.push(pr(wx,wy,hh2));
    }
  }
  var ST=NX+1;
  c.beginPath();
  for(j=NY-1;j>=0;j--){
    for(i=0;i<NX;i++){
      var i00=j*ST+i,i10=i00+1,i01=i00+ST,i11=i01+1;
      var h00=vh[i00],h10=vh[i10],h01=vh[i01],h11=vh[i11];
      if(h00+h10+h01+h11<=0.001)continue;
      if(h00>=Z-0.01&&h10>=Z-0.01&&h01>=Z-0.01&&h11>=Z-0.01)continue;
      c.moveTo(vp[i00].x,vp[i00].y);c.lineTo(vp[i10].x,vp[i10].y);
      c.lineTo(vp[i11].x,vp[i11].y);c.lineTo(vp[i01].x,vp[i01].y);c.closePath();
    }
  }
  c.fillStyle='rgba(112,104,214,.30)';c.fill();
  c.strokeStyle='rgba(236,236,255,.5)';c.lineWidth=1;c.beginPath();
  for(i=0;i<=NX;i+=5){
    for(j=0;j<NY;j++){
      var a0=j*ST+i,a1i=a0+ST;
      if(vh[a0]<=0.001&&vh[a1i]<=0.001)continue;
      if(vh[a0]>=Z-0.01&&vh[a1i]>=Z-0.01)continue;
      c.moveTo(vp[a0].x,vp[a0].y);c.lineTo(vp[a1i].x,vp[a1i].y);
    }
  }
  for(j=0;j<=NY;j+=5){
    for(i=0;i<NX;i++){
      var b0=j*ST+i,b1i=b0+1;
      if(vh[b0]<=0.001&&vh[b1i]<=0.001)continue;
      if(vh[b0]>=Z-0.01&&vh[b1i]>=Z-0.01)continue;
      c.moveTo(vp[b0].x,vp[b0].y);c.lineTo(vp[b1i].x,vp[b1i].y);
    }
  }
  c.stroke();

  /* ----- 7. 구름, 비 (깊이 순서로) ----- */
  var spr=[],q;
  for(i=0;i<wC.length;i++){
    var cl=wC[i],v=clamp((P.cl-cl.dl)/0.3,0,1)*cloudA;
    if(v<=0)continue;
    var pa=pointAt(FR.uA+2+cl.f*(FR.total-FR.uA-4));
    var cxp=pa[0]-pa[3]*cl.dd, cyp=pa[1]+pa[2]*cl.dd;     /* 전선의 찬 공기 쪽(왼쪽)으로 */
    if(cxp<1||cxp>X-1||cyp<1||cyp>Y-1)continue;
    var czp=0.55*cl.dd+1.4+cl.zr;
    q=pr(cxp,cyp,czp);
    spr.push({d:q.d,k:0,q:q,cl:cl,v:v,x:cxp,y:cyp,z:czp});
  }
  for(i=0;i<cC.length;i++){
    var cl2=cC[i],v2=clamp((P.cl-cl2.dl)/0.3,0,1)*cloudA;
    if(v2<=0)continue;
    var pb2=pointAt(FR.uA-2-cl2.f*(FR.uA-4)), off=1.5+cl2.dd*0.6;
    var cxq=pb2[0]+pb2[3]*off, cyq=pb2[1]-pb2[2]*off;     /* 따뜻한 공기 쪽(오른쪽)으로 */
    if(cxq<1||cxq>X-1||cyq<1||cyq>Y-1)continue;
    q=pr(cxq,cyq,cl2.z);
    spr.push({d:q.d,k:0,q:q,cl:cl2,v:v2,x:cxq,y:cyq,z:cl2.z});
  }
  if(OCC>0.02){
    for(i=0;i<oC.length;i++){
      var cl3=oC[i],v3=clamp((OCC*1.2-cl3.dl)/0.3,0,1)*cloudA;
      if(v3<=0)continue;
      var oq=occAt(cl3.f);
      if(!oq)continue;
      var cxo=oq[0]-oq[3]*cl3.side*cl3.dd, cyo=oq[1]+oq[2]*cl3.side*cl3.dd;
      if(cxo<1||cxo>X-1||cyo<1||cyo>Y-1)continue;
      q=pr(cxo,cyo,cl3.z);
      spr.push({d:q.d,k:0,q:q,cl:cl3,v:v3,x:cxo,y:cyo,z:cl3.z});
    }
  }
  spr.sort(function(a,b){return b.d-a.d;});
  for(i=0;i<spr.length;i++){
    var sp3=spr[i];
    if(sp3.k===0){
      var rp=sp3.cl.r*SC*sp3.q.f*(0.4+0.6*sp3.v);
      c.globalAlpha=sp3.v;
      c.fillStyle='rgba(120,135,165,.35)';puff(c,sp3.q.x,sp3.q.y+rp*0.35,rp);
      c.fillStyle='rgba(255,255,255,.94)';puff(c,sp3.q.x,sp3.q.y,rp);
      if(P.rain>sp3.cl.dl*0.9&&sp3.v>0.7){
        c.strokeStyle='rgba(225,240,255,.95)';c.lineWidth=1.8;c.lineCap='round';
        for(var rk=0;rk<2;rk++){
          var fall=(clock*0.8+sp3.cl.ph+rk*0.5)%1;
          var zz=sp3.z*(1-fall), rx=sp3.x+(rk?0.9:-0.9);
          var ra=pr(rx,sp3.y,zz),rb=pr(rx,sp3.y,Math.max(0,zz-1.8));
          c.beginPath();c.moveTo(ra.x,ra.y);c.lineTo(rb.x,rb.y);c.stroke();
        }
      }
      c.globalAlpha=1;
    }
  }

  /* ----- 8. 큰 이동 화살표 (초기 흐름 방향) ----- */
  var ba=opts.arrows?0.92:0.92*(1-smooth(0.2,0.6,t));
  if(ba>0.01){
    c.globalAlpha=ba;
    arrow3(c,[88,60,4],[62,60,4],'#2a5fbf',9,22);
    arrow3(c,[12,7,3],[38,7,3],'#c2410c',9,22);
    arrow3(c,[46,16,3],[72,16,3],'#c2410c',9,22);
    c.globalAlpha=1;
  }

  /* ----- 9. 저기압 표시, 반시계 화살표, 이름표 ----- */
  var ra2=smooth(0.55,0.8,t);
  if(ra2>0.01){
    c.globalAlpha=ra2;
    [0,Math.PI].forEach(function(off){
      var st=off-0.42*Math.PI, en=off+0.42*Math.PI, ps=[];
      for(var k=0;k<=24;k++){
        var th=st+(en-st)*k/24;
        ps.push(pr(CXw+11*Math.cos(th),ly+11*Math.sin(th),1.8));
      }
      c.lineCap='round';c.lineJoin='round';c.beginPath();
      for(var m=0;m<ps.length;m++){if(m)c.lineTo(ps[m].x,ps[m].y);else c.moveTo(ps[m].x,ps[m].y);}
      c.strokeStyle='rgba(20,30,60,.6)';c.lineWidth=6.5;c.stroke();
      c.strokeStyle='#fff';c.lineWidth=3.2;c.stroke();
      var A2=ps[ps.length-1],B2=ps[ps.length-3];
      var dx=A2.x-B2.x,dy=A2.y-B2.y,dl=Math.hypot(dx,dy);dx/=dl;dy/=dl;
      c.beginPath();c.moveTo(A2.x+dx*9,A2.y+dy*9);
      c.lineTo(A2.x-dx*3+dy*7.5,A2.y-dy*3-dx*7.5);c.lineTo(A2.x-dx*3-dy*7.5,A2.y-dy*3+dx*7.5);c.closePath();
      c.fillStyle='rgba(20,30,60,.6)';c.fill();
      c.beginPath();c.moveTo(A2.x+dx*7,A2.y+dy*7);
      c.lineTo(A2.x-dx*2+dy*5.5,A2.y-dy*2-dx*5.5);c.lineTo(A2.x-dx*2-dy*5.5,A2.y-dy*2+dx*5.5);c.closePath();
      c.fillStyle='#fff';c.fill();
    });
    var ql=pr(CXw,ly-14,1.8);
    if(!opts.simple)label(c,'반시계 방향',ql.x,ql.y+8,{size:15,weight:700,align:'center'});
    c.globalAlpha=1;
  }
  var ls=smooth(0.25,0.5,t);
  if(ls>0.01){
    var qm=pr(CXw,ly,2.2);
    c.beginPath();c.arc(qm.x,qm.y,20*ls,0,7);c.fillStyle='#fff';c.fill();
    c.strokeStyle='#c8283c';c.lineWidth=3;c.stroke();
    c.fillStyle='#c8283c';c.font='700 '+(23*ls)+'px '+FONT;c.textAlign='center';c.textBaseline='middle';
    c.fillText('저',qm.x,qm.y+1);
  }
  /* 등압선 숫자 */
  for(i=0;i<vals.length;i++){
    var f2=clamp((vals[i]-P.p)/3,0,1);
    if(f2<=0.6||opts.simple||i%2===1)continue;   /* 숫자가 겹치지 않도록 한 줄 건너 표시 */
    var r1=rad[i]*(0.55+0.45*f2), qi=pr(CXw+r1*Math.cos(0.5),ly+r1*Math.sin(0.5),0.2);
    c.globalAlpha=f2;
    label(c,String(vals[i]),qi.x,qi.y,{size:10.5,align:'center',stroke:'rgba(15,25,50,.55)'});
    c.globalAlpha=1;
  }
  var fa=smooth(0.62,0.85,t);
  if(fa>0.01){
    c.globalAlpha=fa;
    var la=pointAt(FR.uA-28), lb=pointAt(FR.uA+30);
    var qc=pr(la[0]-la[3]*6,la[1]+la[2]*6,0.3);
    if(!opts.simple)label(c,'한랭 전선',qc.x-6,qc.y,{size:15,weight:700,align:'right'});
    var qw=pr(lb[0]+lb[3]*7,lb[1]-lb[2]*7,0.3);
    if(!opts.simple)label(c,'온난 전선',qw.x+6,qw.y,{size:15,weight:700,fill:'#4a1f05',stroke:'rgba(255,236,210,.92)'});
    if(OCC>0.4){
      c.globalAlpha=fa*smooth(0.4,0.7,OCC);
      var om=occAt(0.5);
      if(om){var qm2=pr(om[0]-om[3]*7,om[1]+om[2]*7,0.3);label(c,'폐색 전선',qm2.x,qm2.y,{size:15,weight:700,align:'center',stroke:'rgba(75,33,104,.9)'});}
    }
    c.globalAlpha=1;
  }

  /* ----- 10. 앞쪽 유리면(동쪽, 남쪽)과 블록 모서리 ----- */
  WALLS.forEach(function(w){if(w.fr)wallDraw(c,w,'rgba(255,215,160,.12)','rgba(76,120,210,.34)',false);});

  c.lineCap='round';c.lineJoin='round';
  function edge(a,b,strong){
    c.strokeStyle=strong?'rgba(15,25,50,.62)':'rgba(15,25,50,.28)';
    c.lineWidth=strong?1.6:1.4;
    line3(c,a,b);
  }
  WALLS.forEach(function(w){
    var b0=w.a(0),b1=w.a(1);
    edge([b0[0],b0[1],0],[b1[0],b1[1],0],w.fr);
    edge([b0[0],b0[1],Z],[b1[0],b1[1],Z],w.fr);
    if(w.fr)edge([b0[0],b0[1],-SD],[b1[0],b1[1],-SD],true);
  });
  [[0,0,WALLS[1],WALLS[3]],[X,0,WALLS[1],WALLS[2]],[X,Y,WALLS[0],WALLS[2]],[0,Y,WALLS[0],WALLS[3]]].forEach(function(k){
    var st=k[2].fr||k[3].fr;
    edge([k[0],k[1],0],[k[0],k[1],Z],st);
    if(st)edge([k[0],k[1],0],[k[0],k[1],-SD],true);
  });

  /* ----- 11. 글자와 기압 표시 ----- */
  var qa=pr(6,Y-3,Z-3), qb=pr(6,4,9);
  label(c,'찬 공기',qa.x,qa.y,{size:17,weight:700});
  label(c,'따뜻한 공기',qb.x,qb.y,{size:17,weight:700,fill:'#4a1f05',stroke:'rgba(255,236,210,.92)'});

  if(opts.noHud)return;
  var bw=180*TK,bh=62*TK,bx=W-bw-12,by=12;
  rr(c,bx,by,bw,bh,10);c.fillStyle='rgba(255,255,255,.94)';c.fill();
  c.strokeStyle='rgba(20,30,60,.15)';c.lineWidth=1;c.stroke();
  c.fillStyle='#4a5876';c.font='600 '+(12.5*TK)+'px '+FONT;c.textAlign='left';c.textBaseline='middle';
  c.fillText(P.s>0.3?'저기압 중심 기압':'전선 위 지상 기압',bx+12*TK,by+17*TK);
  var num=String(Math.round(P.p));
  c.fillStyle=mix('#15213a','#c8283c',1-(P.p-990)/22);
  c.font='700 '+(29*TK)+'px '+FONT;
  c.fillText(num,bx+12*TK,by+42*TK);
  var nw=c.measureText(num).width;
  c.fillStyle='#4a5876';c.font='600 '+(14*TK)+'px '+FONT;
  c.fillText('hPa',bx+12*TK+nw+6*TK,by+44*TK);
}

/* 전선의 이동: 두 전선이 저기압 중심을 축으로 반시계 방향으로 돌며 이동하고,
   빠른 한랭 전선(9초)이 느린 온난 전선(18초)을 따라잡아 폐색 전선이 된다(총 27초) */

function wxSegCross(pts,out){
  for(var i=0;i<pts.length-1;i++){
    var x1=WA[0],y1=WA[1],x2=WC[0],y2=WC[1],x3=pts[i][0],y3=pts[i][1],x4=pts[i+1][0],y4=pts[i+1][1];
    var den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
    if(Math.abs(den)<1e-9)continue;
    var tt=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/den, uu=-((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/den;
    if(tt>=0&&tt<=1&&uu>=0&&uu<=1)out.push({s:tt,u:(i+uu)});
  }
}
function wxFindCross(){
  var main=[], occ=[], sc=null, sw=null, so=null, k;
  wxSegCross(FR.pts,main);
  for(k=0;k<main.length;k++){
    if(main[k].u*FR.ds<FR.uA){if(sc===null)sc=main[k].s;}
    else{if(sw===null)sw=main[k].s;}
  }
  wxSegCross(FR.occ,occ);
  if(occ.length)so=occ[0].s;
  if(sc!==null&&sw!==null){wxCross.sc=sc;wxCross.sw=sw;wxCross.merged=false;}
  else if(so!==null){wxCross.so=so;wxCross.merged=true;}
  else{
    if(sc!==null)wxCross.sc=sc;
    if(sw!==null)wxCross.sw=sw;
  }
}

function wxEllipse(c,xc,th0,th1,move){
  /* 한랭 전선면: 가장자리가 가파른 둥근 곡선 (th=0이 지면 위의 발끝, 커질수록 위로) */
  var n=40;
  for(var k=0;k<=n;k++){
    var th=th0+(th1-th0)*k/n;
    var qx=xc*Math.cos(th), qy=GYW-176*Math.sin(th);

}
function drawWxFronts(c,xc,xw,q){

  c.beginPath();c.moveTo(0,GYW);c.lineTo(0,GYW-176);

  var ye=ty-(WW-tx)*WSL;

  wxEllipse(c,xc,0,th,false);c.closePath();

  c.beginPath();c.arc(tx,ty,6,0,7);c.fillStyle='#7b3fa0';c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();

function wxArrow(c,pts,width,col,headLen){
  /* 꼬리는 옅고 머리는 진한 굵은 화살표 */
  var n=pts.length,i;
  c.lineCap='round';c.lineJoin='round';
  for(i=1;i<n;i++){
    c.strokeStyle='rgba('+col+','+(0.25+0.7*i/(n-1))+')';
    c.lineWidth=width*(0.55+0.45*i/(n-1));

  }
  var a=pts[n-1],b=pts[n-3]||pts[n-2];

  c.moveTo(a[0]+Math.cos(ang)*headLen,a[1]+Math.sin(ang)*headLen);

function drawCumulo(c,cx,cy,tm){

  }
  /* 3층: 윗면 하이라이트 */
  for(i=0;i<cbPuffs.length;i++){
    p=cbPuffs[i];
    if(p.y>-24)continue;
    c.fillStyle='rgba(255,255,255,.55)';
    c.beginPath();c.arc(cx+p.x*1.25-2,cy+p.y*1.25-4,p.r*0.8,0,7);c.fill();
  }
}
var stPuffs=[], i4;
for(i4=0;i4<46;i4++){
  var su=i4/45;
  stPuffs.push({u:su,off:(wr2()-0.5)*14,rx:15+wr2()*16,ry:5+wr2()*5+(1-su)*7,ph:wr2()*6});
}
function drawStratus(c,tm,x0,y0,off){
  var ang=-Math.atan(WSL), i, p;
  for(var pass=0;pass<2;pass++){
    for(i=0;i<stPuffs.length;i++){
      p=stPuffs[i];
      var cx=x0+off+p.u*266, cy=wxLineY(cx,x0,y0)-22-p.u*10-p.off+Math.sin(tm*0.6+p.ph)*0.5;
      var dark=1-p.u;   /* 왼쪽(전선에 가까운 쪽)일수록 두껍고 어둡다 */
      c.save();c.translate(cx,cy);c.rotate(ang);
      if(pass===0){
        c.fillStyle='rgba('+Math.round(lerp(150,190,p.u))+','+Math.round(lerp(158,198,p.u))+','+Math.round(lerp(172,210,p.u))+',.95)';
        c.beginPath();c.ellipse(0,3,p.rx,p.ry+2,0,0,7);c.fill();
      }else{
        c.fillStyle='rgba(255,255,255,'+(0.78+0.2*dark)+')';
        c.beginPath();c.ellipse(0,-2,p.rx*0.9,p.ry*0.75,0,0,7);c.fill();
      }
      c.restore();
    }
  }
}

/* 각 지역(A, B, C)의 날씨: 전선 위치에 따라 달라진다 */
function wxWeather(x,xc,xw){
  if(x<xc-112)return ['cold','맑음 · 기온 낮음'];
  if(x<xc+6)return ['shower','소나기 (강한 비)'];
  if(x<xw)return ['warm','맑고 따뜻함'];
  if(x<xw+46)return ['cloud','흐림'];
  return ['rain','흐리고 비 (장시간)'];
}
var WXCOL={cold:'#5b8fd6',shower:'#2b5aa8',warm:'#f08a24',cloud:'#8b95a5',rain:'#4a6a99'};
var WXCAP=[
  '전선의 이동 버튼을 누르면 두 전선이 저기압 중심을 축으로 반시계 방향으로 돌면서 오른쪽(동쪽)으로 이동해요. 결국 빠른 한랭 전선이 느린 온난 전선을 따라잡아 폐색 전선이 만들어져요.',
  '두 전선이 반시계 방향으로 돌며 동쪽으로 이동해요. 한랭 전선이 더 빨라서, 두 전선 사이의 따뜻한 공기가 점점 좁아져요.',
  '한랭 전선이 B 지역을 지나가고 있어요. 적운형 구름에서 짧은 시간 동안 강한 소나기가 내려요.',
  '한랭 전선이 지나간 B 지역에는 찬 공기가 들어와 기온이 떨어졌어요. 한랭 전선은 계속 빠르게 다가가고, 두 전선 사이의 따뜻한 공기는 거의 사라져 가요.',
  '한랭 전선이 온난 전선을 따라잡았어요! 두 전선이 겹쳐지면서 따뜻한 공기가 지표에서 떨어져 위로 밀려 올라가고 있어요.',
  '이렇게 한랭 전선이 온난 전선을 따라잡아 겹쳐진 전선을 폐색 전선이라고 해요. 따뜻한 공기는 위로 밀려 올라가고, 지표 가까이에는 찬 공기만 남아요.'
];
var wxMoveBtn=document.getElementById('wxMove'), wxCapEl=document.getElementById('wxCap');
function updateWxBtn(){
  if(wxMode==='idle'){wxMoveBtn.textContent='전선의 이동';wxMoveBtn.disabled=false;}
  else if(wxMode==='done'){wxMoveBtn.textContent='다시 보기';wxMoveBtn.disabled=false;}
  else{wxMoveBtn.textContent='이동 중...';wxMoveBtn.disabled=true;}
}
wxMoveBtn.addEventListener('click',function(){
  if(wxMode==='idle')wxMode='moving';
  else if(wxMode==='done')wxMode='rewind';
  updateWxBtn();
});
var wxCloudBtn=document.getElementById('wxCloudBtn');
wxCloudBtn.addEventListener('click',function(){
  wxCloudsOn=!wxCloudsOn;
  wxCloudBtn.setAttribute('aria-pressed',wxCloudsOn?'true':'false');
  wxCloudBtn.textContent=wxCloudsOn?'구름 숨기기':'구름 보이기';
});
function stepWxTime(dt){
  wxCloudA+=((wxCloudsOn?1:0)-wxCloudA)*Math.min(1,dt*8);
  if(Math.abs((wxCloudsOn?1:0)-wxCloudA)<0.01)wxCloudA=wxCloudsOn?1:0;
  if(wxMode==='moving'){wxSec+=dt;if(wxSec>=WXDUR){wxSec=WXDUR;wxMode='done';updateWxBtn();}}
  else if(wxMode==='rewind'){wxSec-=dt*WXDUR/1.2;if(wxSec<=0){wxSec=0;wxMode='moving';updateWxBtn();}}
}

function drawWx(dt){
  var c=cxw, sc=cvWx.width/WW;
  wxK=clamp(700/(cvWx.clientWidth||900),1,1.7);
  if(!wxBg)buildWxBg();
  stepWxTime(dt);
  /* 입체 블록을 별도 캔버스에 그린 뒤 위쪽에 배치 */
  withWxState(function(){
    stepGround(dt);
    drawScene(wxOff.getContext('2d'),wxOff.width/W,{noHud:true,arrows:true,simple:true});
    var pa=pr(WA[0],WA[1],0.05), pc2=pr(WC[0],WC[1],0.05);
    var pb=pr(WA[0]+(WC[0]-WA[0])*WSB,WA[1]+(WC[1]-WA[1])*WSB,0.05);
    wxABC=[pa,pb,pc2];
  });
  /* 단면도에서 전선이 닿는 위치: A에서 C까지의 선과 전선이 만나는 지점을 그대로 옮긴다 */
  var q=0, xc, xw;
  if(wxCross.merged){
    q=clamp((wxSec-23.5)/(WXDUR-23.5),0,1);
    xc=130+wxCross.so*746+q*24; xw=xc;
  }else{
    xc=130+wxCross.sc*746; xw=130+wxCross.sw*746;
  }
  var th=q*0.49, Tx=xc*Math.cos(th), Ty=GYW-176*Math.sin(th);
  var lx0=q>0?Tx:xw, ly0=q>0?Ty:GYW;       /* 온난 전선면이 지나는 기준점 */
  c.setTransform(sc,0,0,sc,0,0);c.globalAlpha=1;
  c.clearRect(0,0,WW,WH);
  c.drawImage(wxBg,0,0,WW,WH);
  var tm=clock;

  /* 찬 공기 영역과 전선면 */
  drawWxFronts(c,xc,xw,q);

  /* 선택한 지역 표시 */
  if(wxSel){
    var bands={A:[30,330],B:[352,600],C:[620,940]}, bd=bands[wxSel];
    c.fillStyle='rgba(255,255,255,.34)';c.fillRect(bd[0],410,bd[1]-bd[0],GYW-410);
    c.strokeStyle='#c8283c';c.lineWidth=3;c.setLineDash([8,6]);c.strokeRect(bd[0],410,bd[1]-bd[0],GYW-410);c.setLineDash([]);
    wxLabel(c,wxSel+' 지역',bd[0]+12,430,18,'left');
  }

  /* 입체 블록 */
  var BX=135,BY=-50,BW=691,BH=432, kx=BW/W, ky=BH/H;
  c.drawImage(wxOff,0,0,wxOff.width,wxOff.height,BX,BY,BW,BH);
  var P3=wxABC.map(function(q2){return [BX+q2.x*kx,BY+q2.y*ky];});
  c.setLineDash([2,4]);c.strokeStyle='rgba(30,40,60,.65)';c.lineWidth=1.3;
  c.beginPath();c.moveTo(P3[0][0],P3[0][1]);c.lineTo(130,GYW+6);c.moveTo(P3[2][0],P3[2][1]);c.lineTo(876,GYW+6);c.stroke();
  c.setLineDash([]);
  c.strokeStyle='#111';c.lineWidth=1.8;c.beginPath();c.moveTo(P3[0][0],P3[0][1]);c.lineTo(P3[2][0],P3[2][1]);c.stroke();
  ['A','B','C'].forEach(function(nm,i){
    c.beginPath();c.arc(P3[i][0],P3[i][1],3.6,0,7);c.fillStyle='#111';c.fill();
    c.font='700 15px '+FONT;c.textAlign='center';c.textBaseline='middle';
    var lx=P3[i][0]+(i===1?0:(i===0?-12:12)), ly2=P3[i][1]-(i===1?13:11);
    c.lineWidth=4;c.strokeStyle='rgba(255,255,255,.85)';c.strokeText(nm,lx,ly2);
    c.fillStyle='#111';c.fillText(nm,lx,ly2);
  });

  /* 구름의 위치: 폐색이 되면 한랭 전선의 구름과 온난 전선의 구름이 위로 올라가 하나로 합쳐진다 */
  var cumX=lerp(xc-62,Tx-40,q), cumY=lerp(500,Ty-62,q), rainTop=lerp(528,Ty-26,q);

  /* 비 (구름과 함께 숨겨진다) */
  c.globalAlpha=wxCloudA;
  c.lineCap='round';
  var i,d;
  for(i=0;i<rainL.length;i++){
    d=rainL[i];
    var x0=xc+d.x-q*20, f=(tm*0.75+d.ph)%1, y0=rainTop, y1=GYW-2, yy=y0+f*(y1-y0), xx=x0-(yy-y0)*0.22;
    if(x0<2)continue;
    c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=1.3;
    c.beginPath();c.moveTo(x0,y0);c.lineTo(x0-(y1-y0)*0.22,y1);c.stroke();
    c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=2;
    c.beginPath();c.moveTo(xx,yy);c.lineTo(xx-2.2,yy+10);c.stroke();
  }
  for(i=0;i<rainR.length;i++){
    d=rainR[i];
    var x1=lx0+d.x-q*30;
    if(x1>WW-4)continue;
    var ys=wxLineY(x1,lx0,ly0)+3, ye=GYW-2, f2=(tm*0.5+d.ph)%1, yv=ys+f2*(ye-ys), xv=x1-(yv-ys)*0.3;
    c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=1.2;
    c.beginPath();c.moveTo(x1,ys);c.lineTo(x1-(ye-ys)*0.3,ye);c.stroke();
    c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=1.8;
    c.beginPath();c.moveTo(xv,yv);c.lineTo(xv-3,yv+11);c.stroke();
  }

  /* 구름 */
  drawCumulo(c,cumX,cumY,tm);
  drawStratus(c,tm,lx0,ly0,90-q*70);
  c.globalAlpha=1;

  /* 공기의 이동 화살표 (전선을 따라 같이 이동) */
  var pulse=1+0.03*Math.sin(tm*2);
  var curve=[];
  for(i=0;i<=14;i++){
    var u=i/14, bx2=(1-u)*(1-u)*(xc+84)+2*u*(1-u)*(xc+68)+u*u*(xc+28), by2=(1-u)*(1-u)*546+2*u*(1-u)*520+u*u*484;
    curve.push([bx2,by2]);
  }
  if(q<0.95){c.globalAlpha=1-q;wxArrow(c,curve,16*pulse,'224,52,52',26);c.globalAlpha=1;}
  var lin=[];
  for(i=0;i<=10;i++){
    var v=i/10, ax=lx0-44+v*168;
    lin.push([ax,lerp(572-v*60,wxLineY(ax,lx0,ly0)-44-26*v,q)]);
  }
  wxArrow(c,lin,17*pulse,'224,52,52',28);
  wxArrow(c,[[154,572],[196,572]],11,'27,116,214',20);
  wxArrow(c,[[800,572],[844,572]],11,'27,116,214',20);
  wxLabel(c,'찬 공기',203,572,17,'left');
  wxLabel(c,'찬 공기',852,572,17,'left');
  wxLabel(c,'따뜻한 공기',lerp((xc+xw)/2,Tx+130,q),lerp(570,Ty-84,q),17,'center');
  if(q>0.25){
    c.globalAlpha=smooth(0.25,0.55,q);
    wxLabel(c,'폐색 전선',xc+10,GYW-22,17,'left');
    c.globalAlpha=1;
  }

  /* A, B, C 지점과 그곳의 날씨 */
  var stW=[];
  [[130,'A'],[400,'B'],[876,'C']].forEach(function(st){
    c.beginPath();c.arc(st[0],GYW+7,4.6,0,7);c.fillStyle='#111';c.fill();
    c.font='700 17px '+FONT;c.textAlign='center';c.textBaseline='middle';
    c.lineWidth=4;c.strokeStyle='rgba(255,255,255,.85)';c.strokeText(st[1],st[0],GYW+40);
    c.fillStyle='#111';c.fillText(st[1],st[0],GYW+40);
    var w=wxWeather(st[0],xc,xw); stW.push(w[0]);
    var txt=w[1], fs=14.5*wxK;
    c.font='700 '+fs+'px '+FONT;
    var tw=c.measureText(txt).width+34*wxK, ch=30*wxK, cx2=clamp(st[0],tw/2+8,WW-tw/2-8), cy2=GYW+76;
    rr(c,cx2-tw/2,cy2-ch/2,tw,ch,ch/2);c.fillStyle='rgba(255,255,255,.94)';c.fill();
    c.strokeStyle=WXCOL[w[0]];c.lineWidth=2.5;c.stroke();
    c.beginPath();c.arc(cx2-tw/2+14*wxK,cy2,6*wxK,0,7);c.fillStyle=WXCOL[w[0]];c.fill();
    c.fillStyle='#14233f';c.textAlign='left';c.textBaseline='middle';
    c.fillText(txt,cx2-tw/2+26*wxK,cy2+0.5);
  });

  /* 말풍선: 폐색이 되면 폐색 전선 설명으로 바뀐다 */
  var fo=(1-smooth(0,0.25,q))*wxCloudA;
  if(fo>0.01){
    c.globalAlpha=fo;
    wxCallout(c,195,262,160,84,['적운형 구름이 만들어지며','좁은 지역에 소나기성','비가 내린다.'],cumX,cumY-77,cumY-77);
    var rxc=clamp(lx0+170,lx0+60,900), ryc=wxLineY(rxc,lx0,ly0)-36;
    wxCallout(c,705,366,160,84,['층운형 구름이 만들어지며','넓은 지역에 장시간','비가 내린다.'],rxc,ryc,ryc);
    c.globalAlpha=1;
  }
  var fi=smooth(0.1,0.4,q);
  if(fi>0.01){
    c.globalAlpha=fi;
    wxCallout(c,190,262,262,84,['한랭 전선이 온난 전선을 따라잡아','겹쳐지면 따뜻한 공기가 지표에서','떨어져 위로 밀려 올라간다.'],Tx,Ty+2,Ty+2);
    c.globalAlpha=1;
  }

  /* 설명 문구: 이동 상황에 맞춰 바뀐다 */
  var ph=0;
  if(wxMode!=='idle'||wxSec>0.05){
    ph=1;
    if(q>0.5)ph=5;
    else if(q>0.02)ph=4;
    else if(stW[1]==='shower')ph=2;
    else if(stW[1]==='cold')ph=(xw-xc<70)?3:3;
  }
  if(ph!==wxPhase){wxPhase=ph;wxCapEl.textContent=WXCAP[ph];}
}

var wxCards=document.querySelectorAll('.wxcard');
wxCards.forEach(function(b){
  b.addEventListener('click',function(){
    var k=b.getAttribute('data-k');
    wxSel=(wxSel===k)?null:k;
    wxCards.forEach(function(o){o.setAttribute('aria-pressed',o.getAttribute('data-k')===wxSel?'true':'false');});
  });
});

function setTab(k){
  tab=k;
  viewForm.hidden=(k!=='form'); viewWx.hidden=(k!=='wx');
  tabForm.setAttribute('aria-selected',k==='form'?'true':'false');
  tabWx.setAttribute('aria-selected',k==='wx'?'true':'false');
  tabForm.tabIndex=(k==='form')?0:-1; tabWx.tabIndex=(k==='wx')?0:-1;
  if(k==='form'){
    pageTitle.textContent='온대저기압은 어떻게 만들어질까?';
    pageSub.textContent='1단계. 팽팽하던 두 기단의 균형이 깨지면 저기압이 생긴다';
    fit();
  }else{
    pageTitle.textContent='온대저기압 주변의 날씨';
    pageSub.textContent='전선이 지나갈 때 날씨는 어떻게 달라질까?';
    fitWx();
  }
}
tabForm.addEventListener('click',function(){setTab('form');});
tabWx.addEventListener('click',function(){setTab('wx');});
[tabForm,tabWx].forEach(function(b){
  b.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      var k=(tab==='form')?'wx':'form';
      setTab(k);(k==='form'?tabForm:tabWx).focus();
    }
  });
});
window.addEventListener('resize',function(){if(tab==='wx')fitWx();});

var prev=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-prev)/1000);prev=now;clock+=dt;
  if(tab==='wx'){drawWx(dt);requestAnimationFrame(frame);return;}
  cloudA+=((cloudsOn?1:0)-cloudA)*Math.min(1,dt*8);
  if(Math.abs((cloudsOn?1:0)-cloudA)<0.01)cloudA=cloudsOn?1:0;
  if(mode==='playing'){t+=dt/DUR;if(t>=1){t=1;mode='done';updateBtn();}}
  else if(mode==='rewinding'){
    t-=dt/1.1;advT=Math.max(0,advT-dt/1.1);advWt=Math.max(0,advWt-dt/1.1);occT=Math.max(0,occT-dt/1.1);
    if(t<=0){t=0;advT=0;advWt=0;occT=0;advB=0;mode='playing';updateBtn();}
  }
  else if(mode==='adv'){
    if(advKind==='cold'){advT+=dt/ADVDUR;if(advT>=1){advT=1;mode='advDone';updateBtn();}}
    else if(advKind==='warm'){advWt+=dt/ADVWDUR;if(advWt>=1){advWt=1;mode='advDone';updateBtn();}}
    else{
      /* 두 전선: 한랭(9초, 빠름)과 온난(18초, 느림)이 동시에 전진하고, 10초부터 한랭 전선이 따라잡아 폐색 */
      advB+=dt;
      advT=clamp(advB/ADVDUR,0,1);advWt=clamp(advB/ADVWDUR,0,1);occT=clamp((advB-10)/(ADVBDUR-10),0,1);
      if(advB>=ADVBDUR){advB=ADVBDUR;mode='advDone';updateBtn();}
    }
  }
  else if(mode==='advRewind'){
    advT=Math.max(0,advT-dt/1.0);advWt=Math.max(0,advWt-dt/1.0);occT=Math.max(0,occT-dt/1.0);
    if(advT<=0&&advWt<=0&&occT<=0){advB=0;mode='adv';advKind=pendingKind;updateBtn();}
  }
  params();buildFront();stepGround(dt);drawScene(ctx,cv.width/W);syncUI();
  requestAnimationFrame(frame);
}
fit();fitWx();updateBtn();updateWxBtn();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){fit();if(tab==='wx'){fitWx();wxBg=null;}});}
requestAnimationFrame(frame);
})();
