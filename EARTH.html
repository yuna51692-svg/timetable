<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>지구의 자전과 천체의 일주 운동</title>
<style>
:root{
  --bg:#0B1026; --bg2:#131A38; --panel:#1A2246; --line:#2C3768;
  --ink:#EDF1FF; --muted:#95A3CE;
  --east:#38D9C4; --west:#FF9B47; --real:#FF5470; --appa:#FFD23F; --ok:#4ADE80; --lock:#4A5580;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  font-size:clamp(14px,1.95vh,23px);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}

header{display:flex;align-items:center;gap:1vw;padding:.85vh 1.3vw;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:-.02em;font-size:1em;white-space:nowrap;line-height:1.25}
.brand small{display:block;font-weight:500;font-size:.6em;color:var(--muted);letter-spacing:.04em}
nav{display:flex;gap:.35vw;flex:1;justify-content:center}
.tab{background:var(--panel);border:1.5px solid var(--line);color:var(--muted);padding:.7vh .95vw;
  border-radius:10px;font-size:.86em;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s;font-family:inherit}
.tab b{display:block;font-size:.7em;font-weight:800;opacity:.65;letter-spacing:.06em}
.tab.on{background:var(--ink);color:#0B1026;border-color:var(--ink)}
.tab.done{color:var(--ok);border-color:#2C5540}
.tab.done.on{color:#0B1026}
.tab.lock{color:var(--lock);cursor:not-allowed;opacity:.5}
#badge{padding:.65vh .95vw;border-radius:999px;font-size:.82em;font-weight:800;white-space:nowrap;border:1.5px solid var(--line);background:var(--panel)}
#badge.space{color:#9EC1FF;border-color:#2E4585}
#badge.ground{color:#FFC98A;border-color:#6B4A24}

main{position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;grid-template-rows:auto 1fr auto}
.screen.on{display:grid}
.subtabs{display:flex;gap:.35vw;padding:.7vh 1.3vw 0}
.sub{background:transparent;border:1.5px solid var(--line);color:var(--muted);padding:.6vh .9vw;
  border-radius:10px 10px 0 0;font-size:.88em;font-weight:700;cursor:pointer;font-family:inherit}
.sub.on{background:var(--panel);color:var(--ink);border-bottom-color:var(--panel)}
.sub.done{color:var(--ok)}
.sub.lock{color:var(--lock);cursor:not-allowed}
.stage{position:relative;margin:.7vh 1.3vw;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.stage canvas{position:absolute;inset:0;display:block}
.hint{position:absolute;left:1vw;top:1.2vh;z-index:2;background:rgba(11,16,38,.8);border:1px solid var(--line);
  padding:.6vh .9vw;border-radius:11px;font-size:.84em;color:var(--muted);max-width:42%;line-height:1.5}
.hint b{color:var(--ink)}

.dock{padding:1vh 1.3vw 1.2vh;background:var(--bg2);border-top:1px solid var(--line);
  display:grid;grid-template-rows:auto auto;gap:.6vh;min-height:19vh;align-content:start}
.row{display:flex;align-items:center;gap:.55vw;flex-wrap:wrap}
.ask{font-weight:800;font-size:1.24em;letter-spacing:-.01em;margin-right:.3vw}
.ask span{color:var(--muted);font-weight:600;font-size:.78em}
button.opt{background:var(--panel);border:2px solid var(--line);color:var(--ink);
  padding:1vh 1.5vw;border-radius:12px;font-size:1.12em;font-weight:800;cursor:pointer;font-family:inherit;transition:.12s}
button.opt:active{transform:scale(.97)}
button.opt.sel{border-color:var(--ink);background:#28336A}
button.opt.right{border-color:var(--ok);color:var(--ok);background:#16321F}
button.opt:disabled{opacity:.45;cursor:default}
button.go{background:var(--ink);color:#0B1026;border-color:var(--ink)}
button.glyph{font-size:1.9em;line-height:1;padding:.6vh 1.6vw;min-width:5vw}
.chip{padding:.6vh .95vw;border-radius:9px;font-size:1em;font-weight:800;border:2px solid var(--line)}
.chip.e{color:var(--east);border-color:#1E6B60}
.chip.w{color:var(--west);border-color:#7A4A1E}
.fb{min-height:5vh;display:flex;align-items:center;font-size:1.02em;line-height:1.45;color:var(--muted);font-weight:500}
.fb.good{color:var(--ok);font-weight:700}
.fb.bad{color:var(--real);font-weight:700}

/* 다음에 눌러야 할 곳 반짝임 */
@keyframes glow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,0);transform:translateY(0)}
  50%{box-shadow:0 0 0 9px rgba(255,210,63,.16),0 0 20px rgba(255,210,63,.55);transform:translateY(-2px)}
}
@keyframes glowsoft{
  0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,0)}
  50%{box-shadow:0 0 0 6px rgba(255,210,63,.12),0 0 12px rgba(255,210,63,.35)}
}
.next{animation:glow 1.35s ease-in-out infinite;border-color:var(--appa)!important}
.nextset{animation:glowsoft 1.6s ease-in-out infinite;border-color:rgba(255,210,63,.6)!important}
.tab.next,.sub.next{animation:glow 1.35s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.next,.nextset{animation:none;border-color:var(--appa)!important}}

/* ── 학습 완료 축하 화면 ── */
#party{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%,#182258 0%,#080C1E 70%)}
#party.on{display:flex}
#cparty{position:absolute;inset:0;width:100%;height:100%}
.pbox{position:relative;z-index:2;text-align:center;padding:2vh 4vw;max-width:80vw}
.pemo{font-size:9vh;line-height:1;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.pttl{font-size:7.6vh;font-weight:900;letter-spacing:-.03em;margin:.6vh 0 1.6vh;
  background:linear-gradient(92deg,#FFD23F,#FF9B47 45%,#38D9C4);-webkit-background-clip:text;
  background-clip:text;color:transparent;animation:pop .7s .12s cubic-bezier(.2,1.6,.4,1) both}
.psub{font-size:2.6vh;font-weight:800;line-height:1.7;color:var(--ink);animation:rise .6s .34s both}
.pnote{font-size:2.1vh;font-weight:600;line-height:1.7;color:var(--muted);margin-top:1.6vh;animation:rise .6s .52s both}
#pclose{margin-top:3.2vh;background:var(--ink);color:#0B1026;border:none;padding:1.5vh 3.4vw;
  border-radius:14px;font-size:2.2vh;font-weight:900;cursor:pointer;font-family:inherit;animation:rise .6s .7s both}
#pclose:active{transform:scale(.97)}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;
  background:linear-gradient(90deg,#20305F,#3A4A8A);outline:none;flex:1;min-width:18vw}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--appa);border:3px solid #0B1026;cursor:pointer}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:4vw;padding:.5vh .9vw;margin:0 .25vw;
  border-radius:10px;border:2px dashed var(--line);background:var(--panel);font-weight:900;cursor:pointer;font-size:1em;color:var(--muted)}
.blank.filled{border-style:solid;color:var(--ink);border-color:var(--ink)}
.blank.right{border-color:var(--ok);color:var(--ok)}
.blank.wrong{border-color:var(--real);color:var(--real)}
.sent{font-size:1.14em;line-height:2.1;font-weight:700}
.sent .tagr{color:var(--real);font-size:.8em;font-weight:800}
.sent .taga{color:var(--appa);font-size:.8em;font-weight:800}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">지구의 자전과 천체의 일주 운동<small>중학교 과학 1 · Ⅶ. 태양계</small></div>
  <nav id="nav"></nav>
  <div id="badge" class="space">🛰 우주에서 본 모습</div>
</header>
<main>
  <section class="screen" id="sc1"><div class="subtabs" id="sub1">
    <button class="sub on" data-s="map">1-1. 지도의 동서남북</button>
    <button class="sub" data-s="sky">1-2. 하늘의 동서남북</button></div>
    <div class="stage"><div class="hint" id="h1"></div><canvas id="c1"></canvas></div>
    <div class="dock"><div class="row" id="r1"></div><div class="fb" id="f1"></div></div></section>
  <section class="screen" id="sc2"><div class="subtabs"></div>
    <div class="stage"><div class="hint" id="h2"></div><canvas id="c2"></canvas></div>
    <div class="dock"><div class="row" id="r2"></div><div class="fb" id="f2"></div></div></section>
  <section class="screen" id="sc3"><div class="subtabs"></div>
    <div class="stage"><div class="hint" id="h3"></div><canvas id="c3"></canvas></div>
    <div class="dock"><div class="row" id="r3"></div><div class="fb" id="f3"></div></div></section>
  <section class="screen" id="sc4"><div class="subtabs"></div>
    <div class="stage"><div class="hint" id="h4"></div><canvas id="c4"></canvas></div>
    <div class="dock"><div class="row" id="r4"></div><div class="fb" id="f4"></div></div></section>
  <section class="screen" id="sc5"><div class="subtabs" id="sub5"></div>
    <div class="stage"><div class="hint" id="h5"></div><canvas id="c5"></canvas></div>
    <div class="dock"><div class="row" id="r5"></div><div class="fb" id="f5"></div></div></section>
  <section class="screen" id="sc6"><div class="subtabs" id="sub6"></div>
    <div class="stage"><div class="hint" id="h6"></div><canvas id="c6"></canvas></div>
    <div class="dock"><div class="row" id="r6"></div><div class="fb" id="f6"></div></div></section>
</main>
</div>

<div id="party">
  <canvas id="cparty"></canvas>
  <div class="pbox">
    <div class="pemo">🎉</div>
    <div class="pttl">해냈다!!</div>
    <div class="psub">지구가 어느 쪽으로 도는지, 별이 왜 그렇게 흘러가는지<br>이제 완전히 네 것이 됐어!</div>
    <div class="pnote">오늘 밤 하늘을 올려다보면 별들이 어디로 움직일지<br>눈에 훤히 보일 거야. 진짜 멋지다! 👏</div>
    <button id="pclose">🔭 다시 둘러보기</button>
  </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id),D2R=Math.PI/180;
const C={panel:'#1A2246',line:'#2C3768',ink:'#EDF1FF',muted:'#95A3CE',east:'#38D9C4',west:'#FF9B47',
         real:'#FF5470',appa:'#FFD23F',ok:'#4ADE80',sun:'#FFCC3D',star:'#FFFFFF',
         land:'#3E9E6B',landL:'#6FD49B',skin:'#FFD9A8',hair:'#3A2A22',cloth:'#7FA8FF'};

/* ══ 실제 한반도 윤곽 (업로드 이미지에서 추출) ══ */
const KM=[[.907,.002],[.871,0],[.855,.054],[.831,.061],[.786,.057],[.766,.087],[.694,.101],[.605,.099],[.637,.147],[.617,.166],[.472,.149],[.444,.125],[.407,.129],[.29,.21],[.121,.253],[.036,.289],[.032,.309],[0,.317],[.024,.313],[.073,.341],[.089,.339],[.097,.325],[.149,.349],[.198,.349],[.157,.428],[.202,.432],[.222,.442],[.153,.44],[.125,.449],[.121,.463],[.097,.473],[.117,.485],[.085,.487],[.069,.497],[.149,.499],[.153,.505],[.117,.513],[.129,.521],[.206,.521],[.153,.539],[.206,.535],[.234,.519],[.222,.509],[.27,.529],[.282,.523],[.302,.537],[.343,.527],[.335,.551],[.375,.556],[.379,.574],[.411,.584],[.363,.586],[.387,.598],[.411,.598],[.403,.626],[.335,.614],[.339,.628],[.302,.624],[.29,.644],[.355,.648],[.375,.725],[.415,.729],[.343,.753],[.379,.762],[.343,.77],[.327,.8],[.347,.814],[.302,.812],[.335,.828],[.339,.842],[.367,.834],[.355,.859],[.315,.847],[.315,.859],[.355,.873],[.347,.887],[.367,.895],[.391,.891],[.395,.865],[.403,.885],[.476,.849],[.484,.857],[.452,.867],[.456,.879],[.492,.879],[.512,.863],[.496,.844],[.512,.842],[.532,.861],[.556,.84],[.528,.834],[.593,.818],[.609,.82],[.613,.832],[.653,.828],[.669,.851],[.681,.836],[.706,.851],[.726,.834],[.722,.822],[.673,.826],[.677,.814],[.698,.814],[.69,.804],[.77,.816],[.819,.792],[.819,.78],[.843,.766],[.863,.715],[.827,.717],[.831,.628],[.81,.586],[.722,.519],[.653,.444],[.621,.436],[.56,.4],[.508,.392],[.496,.38],[.512,.364],[.524,.372],[.524,.337],[.597,.305],[.685,.291],[.718,.269],[.762,.257],[.782,.236],[.859,.218],[.867,.166],[.847,.158],[.847,.141],[.956,.069],[1,.071],[.988,.052]];
const KJ=[[.419,.974],[.399,.97],[.363,.97],[.302,.984],[.294,.994],[.306,1],[.387,.998],[.403,.992],[.419,.98]];
const KR_W=0.501;              // 폭/높이 비
const SEOUL=[0.372,0.565];     // 서울 (정규화 좌표)

/* 원점 중심, 높이 H로 한반도 그리기 */
function koreaLocal(ctx,H,fill,stroke,lw){
  const W=H*KR_W;
  const path=pts=>{ctx.beginPath();
    pts.forEach((p,i)=>{const x=(p[0]-.5)*W,y=(p[1]-.5)*H;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
    ctx.closePath();ctx.fillStyle=fill;ctx.fill();
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1.5;ctx.lineJoin='round';ctx.stroke()}};
  path(KM);path(KJ);
}
const seoulLocal=H=>({x:(SEOUL[0]-.5)*H*KR_W,y:(SEOUL[1]-.5)*H});

/* ══ 사람: 앞모습 / 뒷모습 / 옆모습 ══ */
/* mode: 'front' | 'back' | 'side'   dir: 옆모습이 향하는 쪽 (1=오른쪽,-1=왼쪽) */
function person(ctx,x,y,s,mode,rot,dir){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  const HR=s*.20, HY=-s*.80;
  ctx.lineCap='round';
  // 다리
  ctx.strokeStyle='#3B4A7A';ctx.lineWidth=s*.085;
  ctx.beginPath();ctx.moveTo(-s*.09,0);ctx.lineTo(-s*.05,-s*.28);
  ctx.moveTo(s*.09,0);ctx.lineTo(s*.05,-s*.28);ctx.stroke();
  // 몸통
  ctx.fillStyle=C.cloth;ctx.beginPath();
  ctx.roundRect(-s*.17,-s*.63,s*.34,s*.37,s*.09);ctx.fill();
  // 팔
  ctx.strokeStyle=C.cloth;ctx.lineWidth=s*.075;
  ctx.beginPath();ctx.moveTo(-s*.16,-s*.55);ctx.lineTo(-s*.23,-s*.32);
  ctx.moveTo(s*.16,-s*.55);ctx.lineTo(s*.23,-s*.32);ctx.stroke();
  // 머리
  ctx.fillStyle=C.skin;ctx.beginPath();ctx.arc(0,HY,HR,0,7);ctx.fill();
  const d=dir||1;
  if(mode==='back'){
    ctx.fillStyle=C.hair;ctx.beginPath();ctx.arc(0,HY,HR,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(0,HY+HR*.86,HR*.42,0,7);ctx.fill();      // 묶은 머리
    ctx.strokeStyle='#6B5248';ctx.lineWidth=s*.014;
    for(let i=-2;i<=2;i++){ctx.beginPath();
      ctx.moveTo(i*HR*.3,HY-HR*.75);ctx.lineTo(i*HR*.36,HY+HR*.75);ctx.stroke()}
  }else if(mode==='front'){
    ctx.fillStyle=C.hair;ctx.beginPath();
    ctx.arc(0,HY,HR,Math.PI*1.06,Math.PI*1.94);ctx.closePath();ctx.fill();
    ctx.fillStyle='#22304F';
    ctx.beginPath();ctx.arc(-HR*.36,HY+HR*.06,HR*.13,0,7);ctx.fill();
    ctx.beginPath();ctx.arc( HR*.36,HY+HR*.06,HR*.13,0,7);ctx.fill();
    ctx.strokeStyle='#22304F';ctx.lineWidth=s*.02;
    ctx.beginPath();ctx.arc(0,HY+HR*.25,HR*.36,.35,Math.PI-.35);ctx.stroke();
  }else{ // 옆모습
    ctx.save();ctx.scale(d,1);
    ctx.fillStyle=C.hair;ctx.beginPath();
    ctx.arc(0,HY,HR,Math.PI*.72,Math.PI*1.98);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.arc(-HR*.62,HY+HR*.30,HR*.34,0,7);ctx.fill();
    ctx.fillStyle=C.skin;ctx.beginPath();                          // 코
    ctx.moveTo(HR*.85,HY+HR*.02);ctx.lineTo(HR*1.22,HY+HR*.24);
    ctx.lineTo(HR*.82,HY+HR*.30);ctx.closePath();ctx.fill();
    ctx.fillStyle='#22304F';ctx.beginPath();ctx.arc(HR*.42,HY+HR*.04,HR*.12,0,7);ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
/* 관측자 시선 화살표 */
function sight(ctx,x,y,len,ang,col){
  const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;
  arrow(ctx,x+Math.cos(ang)*len*.18,y+Math.sin(ang)*len*.18,x2,y2,col||'rgba(255,210,63,.85)',Math.max(2,len*.05),1);
}

/* ══ 캔버스 ══ */
const CV={};
function reg(id){
  const cv=$(id),wrap=cv.parentElement,ctx=cv.getContext('2d'),o={cv,ctx,w:0,h:0};
  const fit=()=>{const r=wrap.getBoundingClientRect();if(r.width<2)return;
    const d=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);
    cv.style.width=r.width+'px';cv.style.height=r.height+'px';
    ctx.setTransform(d,0,0,d,0,0);o.w=r.width;o.h=r.height};
  new ResizeObserver(fit).observe(wrap);fit();CV[id]=o;return o;
}
['c1','c2','c3','c4','c5','c6'].forEach(reg);

/* ══ 그리기 유틸 ══ */
function txt(x,y,s,{f,c,a='center',b='middle',ctx}){ctx.font=f;ctx.fillStyle=c;ctx.textAlign=a;ctx.textBaseline=b;ctx.fillText(s,x,y)}
const fnt=(px,w)=>(w||700)+' '+Math.round(px)+"px 'Pretendard',-apple-system,'Malgun Gothic',sans-serif";
function arrow(ctx,x1,y1,x2,y2,col,wd,dash){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.lineCap='round';
  if(dash)ctx.setLineDash([wd*2.2,wd*2]);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
  const a=Math.atan2(y2-y1,x2-x1),hl=wd*3.4;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(a-.4),y2-hl*Math.sin(a-.4));
  ctx.lineTo(x2-hl*Math.cos(a+.4),y2-hl*Math.sin(a+.4));ctx.closePath();ctx.fill();ctx.restore();
}
function arcArrow(ctx,cx,cy,r,a0,a1,col,wd){
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy,r,a0,a1,a1<a0);ctx.stroke();
  const tg=a1+(a1<a0?-Math.PI/2:Math.PI/2),x=cx+r*Math.cos(a1),y=cy+r*Math.sin(a1),hl=wd*3.4;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y);
  ctx.lineTo(x-hl*Math.cos(tg-.4),y-hl*Math.sin(tg-.4));
  ctx.lineTo(x-hl*Math.cos(tg+.4),y-hl*Math.sin(tg+.4));ctx.closePath();ctx.fill();ctx.restore();
}
function pill(ctx,x,y,s,col,px){
  ctx.font=fnt(px,800);const w=ctx.measureText(s).width+px*1.15,h=px*1.8;
  ctx.fillStyle='rgba(11,16,38,.85)';ctx.strokeStyle=col;ctx.lineWidth=1.8;
  ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,h/2);ctx.fill();ctx.stroke();
  txt(x,y+1,s,{f:fnt(px,800),c:col,ctx});
}
function nightBg(ctx,w,h,dens){
  ctx.fillStyle='#0A0F26';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='rgba(255,255,255,.34)';
  for(let i=0;i<(dens||90);i++){const x=(i*97.31)%w,y=(i*57.77)%h,r=((i*13)%7)/9+.3;
    ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
}
function ground(ctx,w,h,gy){
  const g=ctx.createLinearGradient(0,gy,0,h);
  g.addColorStop(0,'#1B2A4A');g.addColorStop(1,'#0D1428');
  ctx.fillStyle=g;ctx.fillRect(0,gy,w,h-gy);
  ctx.strokeStyle='rgba(149,163,206,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(w,gy);ctx.stroke();
}

/* ══ 지구 (북극 상공에서 본 모습) ══════════
   한반도와 사람은 지구에 붙어 함께 회전한다. */
function globe(ctx,cx,cy,R,spin,o){
  o=o||{};
  const g=ctx.createRadialGradient(cx-R*.3,cy-R*.3,R*.08,cx,cy,R);
  g.addColorStop(0,'#5C9BEA');g.addColorStop(1,'#1B4589');
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#84B6F7';ctx.lineWidth=2;ctx.stroke();
  // 위도권
  ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;
  [.33,.58,.80].forEach(f=>{ctx.beginPath();ctx.arc(cx,cy,R*f,0,7);ctx.stroke()});
  // 한반도
  const phi=(o.phi0===undefined?-Math.PI/2:o.phi0)-spin;
  const rr=R*.56,kx=cx+rr*Math.cos(phi),ky=cy+rr*Math.sin(phi),H=R*.60,th=phi-Math.PI/2;
  ctx.save();ctx.translate(kx,ky);ctx.rotate(th);
  koreaLocal(ctx,H,C.land,C.landL,1.6);ctx.restore();
  // 서울
  const sl=seoulLocal(H),ct=Math.cos(th),st=Math.sin(th);
  const sx=kx+sl.x*ct-sl.y*st, sy=ky+sl.x*st+sl.y*ct;
  const pa=Math.atan2(sy-cy,sx-cx);
  // 밤 그림자 (태양이 화면 오른쪽)
  if(o.night){ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,Math.PI/2,-Math.PI/2);ctx.closePath();
    ctx.fillStyle='rgba(4,7,20,.55)';ctx.fill();ctx.restore()}
  // 북극
  ctx.beginPath();ctx.arc(cx,cy,R*.045,0,7);ctx.fillStyle=C.appa;ctx.fill();
  if(o.poleLabel!==false)pill(ctx,cx,cy-R*.20,'북극',C.appa,R*.10);
  // 사람 (서울에 고정, 옆모습 · 지구 표면에 서 있음)
  if(o.person!==false){
    const ps=R*.30, ox=cx+(sx-cx)/Math.hypot(sx-cx,sy-cy)*R, oy=cy+(sy-cy)/Math.hypot(sx-cx,sy-cy)*R;
    ctx.save();
    person(ctx,ox,oy,ps,'side',pa+Math.PI/2,1);
    ctx.restore();
    ctx.beginPath();ctx.arc(sx,sy,R*.028,0,7);ctx.fillStyle=C.real;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    if(o.seoulLabel!==false){
      const lx=cx+Math.cos(pa)*R*1.30,ly=cy+Math.sin(pa)*R*1.30;
      pill(ctx,lx,ly,'서울',C.real,R*.10);
    }
    if(o.ew){ // 국소 동서 (운동 방향 = 동)
      const tx=Math.sin(pa),ty=-Math.cos(pa),L=R*.46;
      arrow(ctx,ox,oy,ox+tx*L,oy+ty*L,C.east,Math.max(2.5,R*.03));
      pill(ctx,ox+tx*L*1.35,oy+ty*L*1.35,'동',C.east,R*.10);
      pill(ctx,ox-tx*L*.95,oy-ty*L*.95,'서',C.west,R*.10);
    }
  }
  return{sx,sy,pa};
}

/* ══ 관측자 시점 지면 뷰 (1-2 및 미니창 공용) ══ */
function groundView(ctx,x,y,w,h,head,opt){
  opt=opt||{};
  ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.rect(0,0,w,h);ctx.clip();
  nightBg(ctx,w,h,opt.mini?40:110);
  const cx=w*.5,gy=h*.72,R=Math.min(w*.36,h*.42),sq=.30;
  ctx.beginPath();ctx.ellipse(cx,gy,R*1.25,R*1.25*sq,0,0,7);
  ctx.fillStyle='rgba(62,158,107,.22)';ctx.fill();
  ctx.strokeStyle='rgba(149,163,206,.55)';ctx.lineWidth=1.5;ctx.stroke();
  const ps=Math.min(w,h)*(opt.mini?.14:.11);
  [['북',0,C.ink],['동',90,C.east],['남',180,C.ink],['서',270,C.west]].forEach(d=>{
    const a=(d[1]-head)*D2R;
    pill(ctx,cx+R*1.25*Math.sin(a),gy-R*1.25*Math.cos(a)*sq,d[0],d[2],ps);
  });
  if(opt.sun!==undefined&&opt.sun!==null){
    const f=opt.sun,xL=w*.14,xR=w*.86;
    ctx.strokeStyle='rgba(255,210,63,.28)';ctx.lineWidth=1.5;ctx.setLineDash([5,6]);
    ctx.beginPath();
    for(let i=0;i<=40;i++){const u=i/40,px=xL+u*(xR-xL),py=gy-R*.35-Math.sin(Math.PI*u)*h*.42;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
    ctx.stroke();ctx.setLineDash([]);
    if(f>=0&&f<=1){const px=xL+f*(xR-xL),py=gy-R*.35-Math.sin(Math.PI*f)*h*.42;
      ctx.fillStyle='rgba(255,220,110,.35)';ctx.beginPath();ctx.arc(px,py,h*.075,0,7);ctx.fill();
      ctx.fillStyle='#FFE066';ctx.beginPath();ctx.arc(px,py,h*.035,0,7);ctx.fill()}
  }
  // 관측자
  const pm=opt.mode||'back';
  person(ctx,cx,gy-R*.10,Math.min(w,h)*(opt.mini?.34:.30),pm,0,opt.dir||1);
  ctx.restore();
  return{cx:x+cx,gy:y+gy,R};
}
function miniFrame(ctx,x,y,w,h,title){
  ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,12);
  ctx.fillStyle='rgba(11,16,38,.92)';ctx.fill();
  ctx.strokeStyle='rgba(255,201,138,.75)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  txt(x+w/2,y-h*.055,title,{f:fnt(Math.min(w,h)*.10,800),c:'#FFC98A',ctx});
}

/* ══ 천구 (STEP4 및 미니창 공용) ══ */
function rod(v,k,a){const c=Math.cos(a),s=Math.sin(a),d=k[0]*v[0]+k[1]*v[1]+k[2]*v[2];
  return[v[0]*c+(k[1]*v[2]-k[2]*v[1])*s+k[0]*d*(1-c),
         v[1]*c+(k[2]*v[0]-k[0]*v[2])*s+k[1]*d*(1-c),
         v[2]*c+(k[0]*v[1]-k[1]*v[0])*s+k[2]*d*(1-c)]}
function sphere(ctx,cx,cy,R,yaw,t,opt){
  opt=opt||{};const y=yaw*D2R,pit=22*D2R,cp=Math.cos(pit),sp=Math.sin(pit);
  /* Rt = 바라보는 방향 기준 오른쪽 성분, F = 바라보는 방향(멀어지는 쪽) 성분.
     북반구에서 북쪽을 향하면 동쪽이 오른쪽, 남쪽을 향하면 동쪽이 왼쪽이 된다. */
  const P=v=>{const Rt=v[0]*Math.cos(y)-v[1]*Math.sin(y),F=v[0]*Math.sin(y)+v[1]*Math.cos(y);
    return{x:cx+Rt*R,y:cy-(v[2]*cp+F*sp)*R}};
  const AZ=a=>[Math.sin(a*D2R),Math.cos(a*D2R),0];
  ctx.strokeStyle='rgba(149,163,206,.55)';ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<=90;i++){const p=P(AZ(i*4));i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}
  ctx.closePath();ctx.stroke();ctx.fillStyle='rgba(27,42,74,.55)';ctx.fill();
  const pol=[0,Math.cos(37.5*D2R),Math.sin(37.5*D2R)],a1=P(pol),a2=P([-pol[0],-pol[1],-pol[2]]);
  ctx.strokeStyle='rgba(255,210,63,.7)';ctx.lineWidth=1.8;ctx.setLineDash([7,6]);
  ctx.beginPath();ctx.moveTo(a2.x,a2.y);ctx.lineTo(a1.x,a1.y);ctx.stroke();ctx.setLineDash([]);
  [22,48,74].forEach((del,k)=>{
    const st=[Math.sin(del*D2R),Math.cos(del*D2R)*Math.cos(37.5*D2R),-Math.cos(del*D2R)*Math.sin(37.5*D2R)];
    const pts=[];for(let i=0;i<=64;i++){const v=rod(st,pol,i/64*Math.PI*2);pts.push({v,p:P(v)})}
    ctx.lineWidth=opt.mini?1.2:1.8;
    for(let i=0;i<64;i++){const up=pts[i].v[2]>0&&pts[i+1].v[2]>0;
      ctx.strokeStyle=up?'rgba(255,255,255,.5)':'rgba(255,255,255,.09)';
      ctx.beginPath();ctx.moveTo(pts[i].p.x,pts[i].p.y);ctx.lineTo(pts[i+1].p.x,pts[i+1].p.y);ctx.stroke()}
    const v=rod(st,pol,-(t+k*1.3)),p=P(v);
    if(v[2]>-.02){ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(p.x,p.y,R*.045,0,7);ctx.fill();
      ctx.fillStyle=C.star;ctx.beginPath();ctx.arc(p.x,p.y,R*.022,0,7);ctx.fill()}
  });
  ctx.fillStyle=C.appa;ctx.beginPath();ctx.arc(a1.x,a1.y,R*.03,0,7);ctx.fill();
  pill(ctx,a1.x,a1.y-R*.14,'북극성',C.appa,R*(opt.mini?.13:.10));
  [['북',0,C.ink],['동',90,C.east],['남',180,C.ink],['서',270,C.west]].forEach(d=>{
    const p=P(AZ(d[1])),hi=opt.hi===d[0];
    pill(ctx,p.x,p.y,d[0],hi?C.appa:d[2],R*(opt.mini?.16:.13));
  });
  if(opt.mini){
    person(ctx,cx,cy+R*.02,R*.30,'back',0,1);
  }else{
    person(ctx,cx,cy+R*.02,R*.26,'back',0,1);
    pill(ctx,cx,cy+R*.20,'관측자 = 천구의 중심',C.ink,R*.09);
  }
}

/* ══ 상태 ══ */

 s2:{ok:0,spin:0,play:1},

/* ══ STEP 1 ══ */
$('sub1').onclick=e=>{const b=e.target.closest('.sub');if(!b)return;

        else fb(1,'다시 생각해 보세요. 남쪽을 바라보면 북쪽이 등 뒤가 되고, 동서가 지도와 반대로 보입니다.','bad')})));

$('c1').addEventListener('pointerdown',e=>{

});
function slots1(w,h){const cx=w*.5,cy=h*.5,rx=Math.min(w*.28,h*.44),ry=h*.37;

  }else{

      :'땅의 방위는 그대로, 관측자가 몸을 돌려 '+['북','동','남','서'][Math.round(A/90)%4]+'쪽 하늘을 바라보는 중';

/* 24눈금 (1칸 = 1시간 = 15°) */
function ticks24(ctx,cx,cy,R){
  for(let i=0;i<24;i++){
    const a=-Math.PI/2-i*15*D2R,big=i%6===0;
    const r1=R*(big?.86:.93),r2=R*1.03;
    ctx.strokeStyle=big?'rgba(255,210,63,.7)':'rgba(149,163,206,.42)';
    ctx.lineWidth=big?2.5:1.4;ctx.lineCap='butt';
    ctx.beginPath();ctx.moveTo(cx+r1*Math.cos(a),cy+r1*Math.sin(a));
    ctx.lineTo(cx+r2*Math.cos(a),cy+r2*Math.sin(a));ctx.stroke();
  }
}
const CAS=[[-1,.35],[-.5,-.15],[0,.25],[.5,-.15],[1,.3]];
function casShape(ctx,cx,cy,sz,ang,col,lw){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.beginPath();
  CAS.forEach((p,i)=>{const x=p[0]*sz,y=p[1]*sz;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  CAS.forEach(p=>{ctx.beginPath();ctx.arc(p[0]*sz,p[1]*sz,lw*1.3,0,7);ctx.fillStyle=col;ctx.fill()});
  ctx.restore();
}

  person(ctx,w*.10,h*.98,h*.18,'back',0,1);
}

/* ══ 학습 완료 축하 (폭죽 + 색종이) ══ */
const PARTY={on:0,p:[],cf:[],next:0,ctx:null,w:0,h:0};
(function(){
  const cv=$('cparty');PARTY.ctx=cv.getContext('2d');
  const fit=()=>{const d=Math.min(window.devicePixelRatio||1,2);
    PARTY.w=window.innerWidth;PARTY.h=window.innerHeight;
    cv.width=PARTY.w*d;cv.height=PARTY.h*d;PARTY.ctx.setTransform(d,0,0,d,0,0)};
  window.addEventListener('resize',fit);fit();
  $('pclose').onclick=()=>{PARTY.on=0;$('party').classList.remove('on')};
})();
function burst(x,y){
  const hue=Math.random()*360;
  for(let i=0;i<54;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*4.2+1.4;
    PARTY.p.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,
      c:'hsl('+(hue+Math.random()*50)+',95%,'+(58+Math.random()*22)+'%)'})}
}
function showParty(){
  if(PARTY.on)return;
  PARTY.on=1;PARTY.p=[];PARTY.cf=[];PARTY.next=0;
  $('party').classList.add('on');
  for(let i=0;i<130;i++)PARTY.cf.push({x:Math.random()*PARTY.w,y:-Math.random()*PARTY.h,
    vy:Math.random()*1.9+.9,vx:(Math.random()-.5)*.9,r:Math.random()*7+4,
    a:Math.random()*7,va:(Math.random()-.5)*.16,
    c:['#FFD23F','#FF5470','#38D9C4','#FF9B47','#7FA8FF','#4ADE80'][(Math.random()*6)|0]});
  [[.3,.34],[.7,.28],[.5,.46]].forEach((q,i)=>setTimeout(()=>burst(PARTY.w*q[0],PARTY.h*q[1]),i*260));
}
function drawParty(){
  const {ctx,w,h}=PARTY;if(!ctx||w<10)return;
  ctx.clearRect(0,0,w,h);
  if(--PARTY.next<0){PARTY.next=40+Math.random()*45;
    burst(w*(.15+Math.random()*.7),h*(.16+Math.random()*.38))}
  PARTY.p=PARTY.p.filter(p=>p.l>0);
  PARTY.p.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.052;p.vx*=.988;p.vy*=.988;p.l-=.0115;
    ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,7);ctx.fill();
    ctx.globalAlpha=Math.max(0,p.l)*.28;
    ctx.beginPath();ctx.arc(p.x,p.y,6.5,0,7);ctx.fill();
  });
  ctx.globalAlpha=1;
  PARTY.cf.forEach(c=>{
    c.y+=c.vy;c.x+=c.vx+Math.sin(c.y*.02)*.5;c.a+=c.va;
    if(c.y>h+20){c.y=-20;c.x=Math.random()*w}
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
    ctx.fillStyle=c.c;ctx.globalAlpha=.9;
    ctx.fillRect(-c.r/2,-c.r/4,c.r,c.r/2);ctx.restore();
  });
  ctx.globalAlpha=1;
}

/* ══ 루프 ══ */
function tick(){
  const s=S.s1;
  if(s.ph<s.phT)s.ph=Math.min(s.phT,s.ph+.018);
  let dh=s.headT-s.head;while(dh>180)dh-=360;while(dh<-180)dh+=360;
  if(Math.abs(dh)>.4)s.head+=dh*.10;else s.head=s.headT;
  [0,draw1,draw2,draw3,draw4,draw5,draw6][S.step]();
  if(PARTY.on)drawParty();
  requestAnimationFrame(tick);
}
buildNav();go(1);tick();
</script>
